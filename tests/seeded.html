 act1v:"汉代丞相丙吉出行，路上遇到一群人斗殴，死伤的人横在路上，丙吉经过却不闻不问。再往前走，看见有人赶牛，牛喘着气吐着舌头。丙吉却停下车，派随从去问：「你赶着牛走了几里路了？」",
 act2:"掾史怪其失问。吉曰：「民斗相杀伤，长安令、京兆尹职所当禁，宰相不亲小事。方春少阳用事，未可大热，恐牛近行，用暑故喘，此时气失节，恐有伤害。三公典调和阴阳，职当忧，是以问之。」掾史乃服，以吉知大体。",
 act2v:"属官们觉得丞相问错了对象。丙吉说：「百姓斗殴伤亡，是长安令、京兆尹该管的事，宰相不亲自管小事。现在正是春天，天不该这么热，我怕牛没走多远就喘，是天时反常的征兆——这才是宰相该忧虑的大事，所以要问。」属官们这才佩服，认为丙吉懂得什么是大局。",
 note:"「宰相不亲小事。」—— 冯梦龙借此事说：真正的格局，是知道什么事该自己操心，什么事该交给别人。",
 hint:"校园生活：你在班上会不会什么都想管？哪些事该交给值日生、老师，哪些事才最该你操心？",
 tags:["格局","取舍"]},

{id:"zhangju", dept:"察智部", level:"🌿 进阶", title:"张举焚猪",
 act1:"张举为句章令。有妻杀其夫，因放火烧舍，称「火烧夫死」。夫家疑之，诣官诉妻，妻拒而不认。",
 act1v:"张举担任句章县令。有个妻子杀了丈夫，然后放火烧了房子，谎称「丈夫是被火烧死的」。夫家起了疑心，告到官府，妻子拒不承认。",
 act2:"举乃取猪二口，一杀之，一活之，而积薪焚之。活者口中有灰，杀者口中无灰。因验尸，口果无灰也，鞫之服罪。",
 act2v:"张举让人牵来两头猪，一头先杀死，一头留活口，一起堆上柴火烧。烧完后，活猪嘴里有灰，死猪嘴里没有灰。再验尸，死者嘴里果然没有灰——说明起火之前人就已经死了。妻子只得认罪。",
 note:"「以猪证理。」—— 讲不清的道理，做个实验就明白了。",
 hint:"求真：同学之间各说各的理、谁也说服不了谁的时候，能不能像张举一样，找个办法「验证」一下？",
 tags:["思辨","求真"]},

{id:"simaguang", dept:"捷智部", level:"🌱 入门", title:"司马光击瓮",
 act1:"司马光幼与群儿戏于庭。一儿登瓮，足跌没水中，众皆弃去。",
 act1v:"司马光小时候和一群孩子在庭院里玩。一个孩子爬上一只大水缸，失足掉进去被水淹没了，其他孩子都吓得跑掉了。",
 act2:"光持石击瓮破之，水迸，儿得活。",
 act2v:"司马光拿起石头把水缸砸破，水涌出来，孩子得救了。",
 note:"「众皆弃去，光持石击瓮。」—— 别人想的是「把人从水里捞出来」，司马光反过来想：「让水离开人」。",
 hint:"应变：遇到紧急情况，大家都朝一个方向想办法时，能不能反过来想一想？比如够不到高处的东西，除了垫高自己，还能怎样？",
 tags:["应变","冷静"]},

{id:"guanzhong", dept:"明智部", level:"🌿 进阶", title:"管仲识人",
 act1:"管仲病，桓公问曰：「群臣谁可相者？」管仲曰：「知臣莫如君。」公曰：「易牙如何？」对曰：「杀子以适君，非人情，不可。」",
 act1v:"管仲病重，齐桓公问：「大臣中谁可以接任宰相？」管仲说：「最了解臣子的莫过于君主您。」桓公问：「易牙怎么样？」管仲答：「他杀了自己的儿子做菜讨好您，这不合人情，不能信任。」",
 act2:"公曰：「开方如何？」对曰：「倍亲以适君，非人情，难近。」公曰：「竖刁如何？」对曰：「自宫以适君，非人情，难亲。」管仲死，公不用其言，近三子。二年，三子作乱，桓公饿死宫中，尸虫出于户。",
 act2v:"桓公又问开方、竖刁。管仲说：一个背叛父母、一个残害身体来讨好您，都不合人情，不可亲近。管仲死后，桓公没听他的话，亲近这三人。两年后三人作乱，把桓公围困在宫中，桓公活活饿死，死后很久都没人收尸。",
 note:"「非人情，不可近。」—— 一个人对至亲都能下狠手，他对你的好，多半另有所图。",
 hint:"网络与信息：网上有人对你特别好、什么都顺着你——怎么判断他是真朋友，还是另有所图？",
 tags:["识人","网络与信息"]},

{id:"linxiangru", dept:"胆智部", level:"🌿 进阶", title:"蔺相如完璧归赵",
 act1:"赵王得楚和氏璧，秦昭王闻之，愿以十五城请易璧。蔺相如奉璧入秦。秦王坐章台见相如，得璧，传以示美人及左右，左右皆呼万岁。相如视秦王无意偿赵城。",
 act1v:"赵王得到楚国的和氏璧，秦昭王听说后，提出用十五座城来换。蔺相如捧着璧出使秦国。秦王在章台宫接见他，拿到璧后，传给嫔妃和侍从们观赏，大家都高呼万岁。蔺相如看出来：秦王根本没有给赵国城池的诚意。",
 act2:"相如乃前曰：「璧有瑕，请指示王。」王授璧。相如因持璧却立，倚柱，怒发上冲冠，曰：「大王必欲急臣，臣头今与璧俱碎于柱矣！」秦王恐其破璧，乃辞谢固请。相如度秦王特以诈，乃使其从者衣褐，怀其璧，从径道亡，归璧于赵。",
 act2v:"蔺相如上前说：「璧上有个斑点，请让我指给大王看。」秦王把璧递还给他。相如拿璧退后几步，靠柱子站定，怒发冲冠，说：「大王如果一定要逼我，我的头今天就和璧一起撞碎在这柱子上！」秦王怕他真把璧摔碎，只好道歉。相如料定秦王只是用诈，便让随从换上粗布衣服，把璧揣在怀里，抄小路送回赵国。",
 note:"「持璧却立，怒发上冲冠。」—— 真正的勇气不是不怕，而是手里有筹码、心里有分寸。",
 hint:"勇气：如果明知道对方比你强大又不讲理，硬碰硬和想办法周旋，哪个更需要勇气？",
 tags:["勇气","智慧"]},

{id:"wangrong", dept:"捷智部", level:"🌱 入门", title:"王戎识苦李",
 act1:"王戎七岁，尝与诸小儿游。看道边李树多子折枝，诸儿竞走取之，唯戎不动。",
 act1v:"王戎七岁时，曾和一群小孩出去玩。大家看见路边的李树结满了果子，把枝条都压弯了，小孩们争相跑去摘，只有王戎站着不动。",
 act2:"人问之，答曰：「树在道边而多子，此必苦李。」取之，信然。",
 act2v:"有人问他为什么不去，他回答：「树长在路边，果子却还有这么多没人摘，这一定是苦的李子。」摘来一尝，果然如此。",
 note:"「树在道边而多子，此必苦李。」—— 好事情如果唾手可得却没人要，先别急着高兴，想想为什么。",
 hint:"网络与信息：网上「免费领皮肤」「扫码送大奖」这类好事，人人都能看到却「人人有份」——用王戎的思路想一想，可能有什么问题？",
 tags:["思辨","识人"]},

{id:"yanzi", dept:"语智部", level:"🌿 进阶", title:"晏子使楚",
 act1:"晏子使楚。楚人以晏子短，为小门于大门之侧而延晏子。",
 act1v:"晏子出使楚国。楚国人因为晏子个子矮，故意在大门旁边开了一扇小门，请他从小门进去，想羞辱他。",
 act2:"晏子不入，曰：「使狗国者，从狗门入；今臣使楚，不当从此门入。」傧者更道，从大门入。",
 act2v:"晏子不肯进，说：「出使狗国的人，才从狗门进；今天我出使的是楚国，不该从这扇门进。」迎接的官员只好改道，请他从大门进去。",
 note:"「使狗国者从狗门入。」—— 不接对方的羞辱，而是把羞辱轻轻推回去。",
 hint:"校园生活：有同学拿你的外貌或短处开玩笑，除了生气和忍着，还能怎样像晏子一样「把话推回去」？",
 tags:["应变","尊严"]},

{id:"caochong", dept:"捷智部", level:"🌱 入门", title:"曹冲称象",
 act1:"曹冲幼有智意。时孙权曾致巨象，太祖欲知其斤重，访之群下，咸莫能出其理。",
 act1v:"曹冲从小就很聪明。当时孙权送来一头大象，曹操想知道大象有多重，问遍了手下的官员，谁都拿不出办法。",
 act2:"冲曰：「置象大船之上，而刻其水痕所至，称物以载之，则校可知矣。」太祖大悦，即施行焉。",
 act2v:"曹冲说：「把大象牵到大船上，在船舷上刻下水面的位置；再把大象牵走，往船上装其他东西，装到水面回到刻痕为止——称一称这些东西，就知道大象的重量了。」曹操非常高兴，立刻照办。",
 note:"「置象大船之上。」—— 称不动的东西，换成称得动的东西。难题常常不是解不开，而是该换个东西来「代替」它。",
 hint:"学习：做数学题或搭积木卡住时，有没有试过像曹冲一样，找一个「能代替它」的办法？",
 tags:["思辨","智慧"]},

{id:"wenyanbo", dept:"捷智部", level:"🌱 入门", title:"文彦博灌水取球",
 act1:"文彦博幼时与群儿击球，球忽跃入柱穴中，穴深，不能取。群儿谋取之，或以手探，不及。",
 act1v:"文彦博小时候和一群孩子玩球，球忽然蹦进了一个深深的柱子洞里，怎么也拿不出来。孩子们想办法，有的伸手去掏，够不着。",
 act2:"彦博以水灌之，球遂浮出。",
 act2v:"文彦博提来水灌进洞里，球就浮上来了。",
 note:"「以水灌之。」—— 手够不着的东西，让水替你够。工具，就是手臂的延长。",
 hint:"家庭日常：东西掉到沙发底下、缝隙里，手够不着时，你能想出几种「让工具替你够」的办法？",
 tags:["应变","智慧"]},

{id:"sunbin", dept:"兵智部", level:"🌳 挑战", title:"孙膑减灶",
 act1:"魏将庞涓伐韩，齐使孙膑救韩，直走魏都。庞涓弃韩而归，追击齐军。膑令齐军入魏地为十万灶，明日为五万灶，又明日为三万灶。",
 act1v:"魏国大将庞涓攻打韩国，齐国派孙膑救韩，直接杀向魏国都城。庞涓只好放弃韩国回师，追击齐军。孙膑命令齐军进入魏国后，第一天垒十万人做饭的灶，第二天只垒五万，第三天只垒三万。",
 act2:"庞涓行三日，大喜曰：「我固知齐军怯，入吾地三日，士卒亡者过半矣！」乃弃其步军，与其轻锐倍日并行逐之。孙子度其行，暮当至马陵，乃斫大树白而书之曰：「庞涓死于此树之下。」伏弩万余，夹道而伏。涓夜至，见白书，钻火读之，未毕，万弩俱发，魏军大乱。庞涓自知智穷兵败，乃自刭。",
 act2v:"庞涓追了三天，看到灶越来越少，大喜：「我早就知道齐军胆小，进我魏国才三天，士兵就跑掉一大半了！」于是丢下步兵，只带轻骑兵日夜兼程追赶。孙膑估算他傍晚正好赶到马陵，便砍白一棵大树的树皮，写上「庞涓死于此树之下」，埋伏一万弓弩手在道路两旁。庞涓夜里赶到，看见树上的字，点火来读，还没读完，万箭齐发，魏军大乱。庞涓知道自己智谋用尽、败局已定，拔剑自刎。",
 note:"「减灶诱敌。」—— 孙膑利用的是庞涓的骄傲。读这则故事要想一想：被夸「勇敢追击」的庞涓，到底错在哪一步？以诈取胜，在今天还站得住脚吗？",
 hint:"批判讨论：孙膑赢了，但他用的是「让对方误判」的欺骗手段。在竞争和游戏中，怎样的「策略」是聪明的，怎样的就过了线？",
 tags:["思辨","诚信","格局"]},

{id:"hanxin", dept:"上智部", level:"🌿 进阶", title:"韩信忍胯下之辱",
 act1:"韩信贫贱时，淮阴屠中少年有侮信者，曰：「若虽长大，好带刀剑，中情怯耳。」众辱之曰：「信能死，刺我；不能死，出我胯下！」",
 act1v:"韩信穷困时，淮阴一个屠夫家的少年侮辱他，说：「你虽然长得高大，喜欢带刀佩剑，其实胆子很小。」又当众羞辱他说：「韩信，你要是不怕死，就拿剑刺我；要是怕死，就从我裤裆底下钻过去！」",
 act2:"于是信孰视之，俯出胯下，蒲伏。一市人皆笑信，以为怯。后信为楚王，召辱己之少年，以为中尉，告诸将相曰：「此壮士也。方辱我时，我宁不能杀之邪？杀之无名，故忍而就于此。」",
 act2v:"韩信盯着他看了很久，终于俯下身，从他胯下爬了过去。满街的人都笑话韩信，认为他胆小。后来韩信被封为楚王，反而召来当年羞辱他的少年，任命他做中尉，并对将士们说：「这是位壮士。当初他侮辱我时，我难道不能杀了他吗？杀了他没有任何意义，所以我忍下来，才有了今天。」",
 note:"「杀之无名，故忍而就于此。」—— 真正的勇敢不是什么都敢拼，而是知道什么值得拼。",
 hint:"校园生活：如果同学当众挑衅你、让你「是某某就怎样怎样」，接招和忍住，哪个更需要力量？",
 tags:["格局","沉住气"]},

{id:"zichan", dept:"上智部", level:"🌿 进阶", title:"子产不毁乡校",
 act1:"郑人游于乡校，以论执政。然明谓子产曰：「毁乡校，何如？」",
 act1v:"郑国人常在乡校（乡里的学校和公共场所）聚会，议论执政者的得失。大夫然明对子产说：「把乡校拆了，怎么样？」",
 act2:"子产曰：「何为？夫人朝夕退而游焉，以议执政之善否。其所善者，吾则行之；其所恶者，吾则改之，是吾师也，若之何毁之？我闻忠善以损怨，不闻作威以防怨。」仲尼闻是语也，曰：「以是观之，人谓子产不仁，吾不信也。」",
 act2v:"子产说：「为什么要拆？人们早晚到那里聚会，议论政事的好坏。他们认为好的，我就推行；他们讨厌的，我就改正——这地方是我的老师，怎么能拆呢？我只听说用忠诚行善来减少怨言，没听说靠威势来堵住怨言。」孔子听到这件事后说：「由此看来，有人说子产不仁，我是不信的。」",
 note:"「其所恶者，吾则改之，是吾师也。」—— 把批评当成老师，而不是当成敌人。",
 hint:"家庭日常：如果同学背后议论你，你希望堵住他们的嘴，还是听听他们说的有没有道理？爸爸妈妈批评你的时候呢？",
 tags:["格局","思辨"]},

{id:"qixi", dept:"上智部", level:"🌱 入门", title:"祁奚荐贤",
 act1:"晋大夫祁奚老，请致仕。晋侯问：「孰可使嗣？」",
 act1v:"晋国大夫祁奚年老了，请求退休。晋侯问他：「谁可以接替你的职位？」",
 act2:"祁奚对曰：「解狐可。」君曰：「非子之仇邪？」对曰：「君问可，非问臣之仇也。」及解狐卒，君又问，对曰：「午可。」君曰：「非子之子邪？」对曰：「君问可，非问臣之子也。」君子谓祁奚能举善矣：外举不避仇，内举不避亲。",
 act2v:"祁奚回答：「解狐可以。」晋侯问：「他不是你的仇人吗？」祁奚说：「您问的是谁可以胜任，不是问谁是我的仇人。」后来解狐去世，晋侯再问，祁奚答：「祁午可以。」晋侯问：「他不是你的儿子吗？」祁奚说：「您问的是谁可以胜任，不是问谁是我的儿子。」君子称赞祁奚能推举贤人：举荐外人，不避开仇人；举荐亲人，也不避嫌。",
 note:"「外举不避仇，内举不避亲。」—— 荐人只看合不合适，不看和自己亲不亲、仇不仇。",
 hint:"校园生活：选小组长时，你会投给最好的朋友，还是最适合的人？如果你的「对头」确实最合适，你投得下手吗？",
 tags:["格局","诚信"]},

{id:"banchao", dept:"胆智部", level:"🌿 进阶", title:"班超夜袭虏使",
 act1:"班超出使西域，至鄯善。鄯善王广奉超礼敬甚备，后忽更疏懈。超谓其官属曰：「宁觉广礼意薄乎？此必有北虏使来，狐疑未知所从故也。」",
 act1v:"班超出使西域，到达鄯善国。鄯善王起初对班超礼节周到，后来忽然变得冷淡怠慢。班超对部下说：「你们觉不觉得鄯善王的礼数变薄了？这一定是匈奴的使者也来了，他心里犹豫，不知道该站在哪一边。」",
 act2:"超乃会其吏士三十六人，曰：「不入虎穴，不得虎子。当今之计，独有因夜以火攻虏，使彼不知我多少，必大震怖，可殄尽也。」夜乃纵火，虏众惊乱，超手格杀三人，吏兵斩其使及从士三十余级。鄯善王震怖，遂纳子为质，一国服属。",
 act2v:"班超召集部下三十六人，说：「不入虎穴，焉得虎子。眼下唯一的办法，是趁夜火攻匈奴使团，让他们摸不清我们有多少人，必然大乱，可以把他们全歼。」当夜放火，匈奴人大乱，班超亲手格杀三人，部下斩杀使者及随从三十多人。鄯善王震恐，送王子入汉朝为质，全国归附。",
 note:"「不入虎穴，不得虎子。」—— 机会站在冒险一边，但冒险之前，班超早已看清了局势。",
 hint:"思辨：班超的勇敢和鲁莽有什么区别？他动手之前，先做了什么判断？",
 tags:["勇气","思辨"]},

{id:"tiying", dept:"闺智部", level:"🌿 进阶", title:"缇萦上书救父",
 act1:"太仓令淳于意有罪，当刑，诏狱逮系长安。意有五女，随而泣。意怒骂曰：「生子不生男，缓急无可使者！」",
 act1v:"太仓令淳于意犯了罪，要受肉刑，被押往长安。他有五个女儿，跟在后面哭。淳于意怒骂道：「生孩子不生男孩，危急关头没有一个能顶用的！」",
 act2:"少女缇萦伤父之言，随父至长安，上书曰：「妾父为吏，齐中皆称其廉平，今坐法当刑。妾伤夫死者不可复生，刑者不可复属，虽欲改过自新，其道无由也。妾愿入身为官婢，以赎父刑罪，使得改过自新。」书奏，天子怜悲其意，遂下令除肉刑。",
 act2v:"小女儿缇萦为父亲的话感到难过，一路跟到长安，向汉文帝上书说：「我父亲做官，齐国人都称赞他廉洁公正，如今犯法当受肉刑。我痛心的是，人死了不能复生，受刑残缺的肢体不能再接上，即使想改过自新，也没有机会了。我愿意没入官府为奴婢，来赎父亲的刑罪，让他有机会改过自新。」奏书呈上，汉文帝怜悯她的心意，竟因此下令废除了肉刑。",
 note:"「妾愿入身为官婢，以赎父刑罪。」—— 一个小女孩的一封信，改掉了整个国家的酷刑。声音小，不等于没有力量。",
 hint:"新闻时事：缇萦改变了国家的法律。如果一个人觉得规则不公平，除了抱怨，还可以做什么？",
 tags:["勇气","格局","思辨"]},

{id:"tianji", dept:"术智部", level:"🌿 进阶", title:"田忌赛马",
 act1:"齐使者如梁，孙膑以刑徒阴见，说齐使。齐使以为奇，窃载与之齐。齐将田忌善而客待之。忌数与齐诸公子驰逐重射，孙子见其马足不甚相远，马有上、中、下辈。",
 act1v:"齐国使者到大梁，孙膑以刑徒的身份秘密求见，说服了齐使。齐使认为他是奇才，偷偷把他载回齐国。将军田忌赏识孙膑，以客礼相待。田忌常和齐国公子们赛马赌重金，孙膑观察到双方的马脚力相差不远，都可分为上、中、下三等。",
 act2:"孙子谓田忌曰：「君弟重射，臣能令君胜。」及临质，孙子曰：「今以君之下驷与彼上驷，取君上驷与彼中驷，取君中驷与彼下驷。」既驰三辈毕，而田忌一不胜而再胜，卒得王千金。",
 act2v:"孙膑对田忌说：「您尽管下大注，我能让你赢。」比赛时，孙膑说：「用您的下等马对他们的上等马，用上等马对他们的中等马，用中等马对他们的下等马。」三场比赛结束，田忌输一场、赢两场，最终赢了齐王的千金。",
 note:"「一不胜而再胜。」—— 资源不变，换个排法，输局变赢局。",
 hint:"学习：考试复习时间有限，「什么都平均用力」和「把力气花在最能提分的地方」，哪个更像孙膑的思路？",
 tags:["智慧","思辨"]},

{id:"ximenbao", dept:"术智部", level:"🌿 进阶", title:"西门豹治邺",
 act1:"魏文侯时，西门豹为邺令。会长老，问之民所疾苦。长老曰：「苦为河伯娶妇，以故贫。」豹问其故，对曰：「邺三老、廷掾常岁赋敛百姓钱数百万，用其二三十万为河伯娶妇，与祝巫共分其余钱持归。」",
 act1v:"魏文侯时，西门豹任邺县令。他召集长老，询问百姓疾苦。长老说：「最苦的是给河神娶媳妇，大家都因此贫困。」西门豹问缘由，回答说：「邺地的三老、廷掾每年向百姓收几百万钱，只用二三十万给河神办婚事，剩下的和巫婆一起分掉拿回家。」",
 act2:"至为河伯娶妇时，豹往会之河上。曰：「是女子不好，烦大巫妪为入报河伯，得更求好女，后日送之。」即使吏卒共抱大巫妪投之河中。有顷，复投三老。长老、吏傍观者皆惊恐，叩头且破。豹曰：「巫妪、三老不来还，奈之何？」皆叩头曰：「不敢复言为河伯娶妇！」邺吏民大惊恐，从是以后，不敢复言为河伯娶妇。豹即发民凿十二渠，引河水灌民田，田皆溉。",
 act2v:"到了给河神娶亲那天，西门豹到河边观看，说：「这个女子不漂亮，麻烦大巫婆下河去禀报河神，改天再找个漂亮的送去。」就叫差役把大巫婆扔进河里。过一会儿，又把三老扔下河。围观的长老、官吏全都吓得叩头，额头都磕破了。西门豹说：「巫婆、三老不回来复命，怎么办呢？」众人叩头说：「再也不敢提给河神娶媳妇了！」从此邺地再没人敢提此事。西门豹随即征发百姓开凿十二条水渠，引河水灌田，庄稼都得到了灌溉。",
 note:"「以其人之道，还治其人之身。」—— 对付装神弄鬼的骗局，最好的办法是顺着他的逻辑，演给他看。",
 hint:"思辨：巫婆说「不娶媳妇河神就发大水」。西门豹为什么不直接下令禁止，而要先「顺着演」？遇到谣言，揭穿和演示哪个更有力？",
 tags:["思辨","求真","智慧"]},

{id:"chulong", dept:"语智部", level:"🌳 挑战", title:"触龙说赵太后",
 act1:"赵太后新用事，秦急攻之。赵氏求救于齐，齐曰：「必以长安君为质，兵乃出。」太后不肯，大臣强谏。太后明谓左右：「有复言令长安君为质者，老妇必唾其面！」",
 act1v:"赵太后刚掌权，秦国猛攻赵国。赵国向齐国求救，齐国说：「一定要让长安君来做人质，我们才出兵。」太后不肯，大臣们极力劝谏。太后公开对左右说：「谁再敢说让长安君去做人质，我一定朝他脸上吐唾沫！」",
 act2:"左师触龙入见，太后盛气而揖之。触龙谢病足，徐问太后身体、饮食，太后色少解。触龙为幼子求宫中卫士之职，太后笑曰：「丈夫亦爱怜其少子乎？」对曰：「甚于妇人。」因曰：「父母之爱子，则为之计深远。今媪尊长安君之位，而封之以膏腴之地，多予之重器，而不及今令有功于国；一旦山陵崩，长安君何以自托于赵？」太后曰：「诺，恣君之所使之。」于是为长安君约车百乘，质于齐，齐兵乃出。",
 act2v:"左师触龙入宫求见，太后怒气冲冲地等着他。触龙先说脚有病，慢慢问候太后的身体、饮食，太后的脸色稍稍缓和。触龙又为自己的小儿子求一个宫中卫士的职位，太后笑了：「男人也这么疼爱小儿子吗？」触龙答：「比妇人还疼。」趁机说：「父母疼爱子女，就要为他们作长远的打算。如今您抬高长安君的地位，封给他肥沃的土地，赐给他贵重的宝器，却不趁现在让他为国家立功；一旦您百年之后，长安君凭什么在赵国立身？」太后说：「好，任凭你派他去吧。」于是为长安君备车百辆，到齐国做人质，齐国这才出兵。",
 note:"「父母之爱子，则为之计深远。」—— 硬碰硬的劝谏只会碰壁，触龙先谈家常、再谈爱子，把「你不能」换成了「你也是」。",
 hint:"家庭日常：你想说服爸爸妈妈一件事（比如买一个想要的东西），直接吵和触龙这种「先聊对方关心的」方式，哪个更可能成功？",
 tags:["智慧","沉住气"]},

{id:"maosui", dept:"语智部", level:"🌿 进阶", title:"毛遂自荐",
 act1:"秦围邯郸，赵使平原君求救，合从于楚，约与门下食客二十人偕，得十九人，余无可取者。门下有毛遂者，前，自赞于平原君。平原君曰：「夫贤士之处世也，譬若锥之处囊中，其末立见。今先生处胜之门下三年于此矣，左右未有所称诵，胜未有所闻，是先生无所有也。」",
 act1v:"秦军围困邯郸，赵王派平原君向楚国求救、缔结合纵盟约，平原君打算带二十名门客同行，挑到十九人，剩下一个挑不出合适的。门客中有个叫毛遂的，上前向平原君自我推荐。平原君说：「贤能的人活在世上，好比锥子放在口袋里，锥尖立刻就会露出来。如今先生在我门下三年了，左右没人称颂过你，我也没听说过你，可见先生没有什么本事。」",
 act2:"毛遂曰：「臣乃今日请处囊中耳。使遂蚤得处囊中，乃颖脱而出，非特其末见而已。」平原君竟与毛遂偕。至楚，平原君与楚王言合从，日中不决。毛遂按剑历阶而上，曰：「从之利害，两言而决耳。今日出而言从，日中不决，何也？」楚王怒叱，毛遂按剑而前，陈赵楚唇齿之势、秦之可惧，楚王乃歃血定从。平原君曰：「胜不敢复相士。毛先生以三寸之舌，强于百万之师。」",
 act2v:"毛遂说：「我不过是今天才请求放进口袋里罢了。要是早放我进去，我早就整个锋芒都露出来了，何止露个锥尖。」平原君最终带上了毛遂。到了楚国，平原君与楚王谈合纵，谈到中午还没结果。毛遂手按剑柄快步登上台阶，说：「合纵的利害，两句话就能说清。今天从日出谈到中午还不决断，为什么？」楚王怒喝，毛遂按剑上前，陈说赵楚唇齿相依的形势和秦国的可怕，楚王于是歃血为盟，定下合纵。平原君感叹：「我再不敢自诩会识人了。毛先生三寸之舌，强过百万大军。」",
 note:"「臣乃今日请处囊中耳。」—— 有本事的人，也要敢于自己争取机会。等别人发现，不如自己开口。",
 hint:"校园生活：班里选拔主持人或参加比赛，你希望老师点名，还是会像毛遂一样自己举手？「自荐」和「炫耀」的区别在哪里？",
 tags:["勇气","格局"]},

{id:"sunshuao", dept:"上智部", level:"🌱 入门", title:"孙叔敖埋蛇",
 act1:"孙叔敖为婴儿之时，出游，见两头蛇，杀而埋之。归而泣。其母问其故。",
 act1v:"孙叔敖小时候，出去玩，看见一条两头蛇，就把它杀死埋掉了。回家后哭了起来。母亲问他为什么。",
 act2:"叔敖对曰：「闻见两头之蛇者死，向者吾见之，恐去母而死也。」其母曰：「蛇今安在？」曰：「恐他人又见，杀而埋之矣。」其母曰：「吾闻有阴德者天报以福，汝不死也。」及长，为楚令尹。",
 act2v:"孙叔敖回答：「我听说看见两头蛇的人会死，刚才我看见了，恐怕要离开母亲死去了。」母亲问：「蛇现在在哪里？」他说：「我怕别人再看见它，已经把它杀死埋掉了。」母亲说：「我听说暗中积德的人，上天会赐福给他，你不会死的。」孙叔敖长大后，做了楚国的令尹。",
 note:"「恐他人又见，杀而埋之。」—— 自己害怕的时候，还想着不让别人受害，这就是仁心。",
 hint:"家庭日常：有没有一件「自己已经够难受了，但还能顺手为别人做点事」的小事，你这个星期可以做到？",
 tags:["仁心","格局"]},

{id:"guanbao", dept:"明智部", level:"🌿 进阶", title:"管鲍之交",
 act1:"管仲曰：「吾始困时，尝与鲍叔贾，分财利多自与，鲍叔不以我为贪，知我贫也。吾尝为鲍叔谋事而更穷困，鲍叔不以我为愚，知时有利不利也。吾尝三仕三见逐于君，鲍叔不以我为不肖，知我不遭时也。吾尝三战三走，鲍叔不以我为怯，知我有老母也。」",
 act1v:"管仲说：「我当初穷困时，曾和鲍叔一起做生意，分钱财时我多拿了一些，鲍叔不认为我贪心，知道我穷。我曾替鲍叔办事却办得更糟，鲍叔不认为我笨，知道时机有利有不利。我曾三次做官三次被国君赶走，鲍叔不认为我没本事，知道我没遇上好时运。我曾三次打仗三次逃跑，鲍叔不认为我胆小，知道我家里有老母亲。」",
 act2:"「公子纠败，召忽死之，吾幽囚受辱，鲍叔不以我为无耻，知我不羞小节而耻功名不显于天下也。生我者父母，知我者鲍子也。」鲍叔既进管仲，以身下之。天下不多管仲之贤而多鲍叔能知人也。",
 act2v:"「公子纠失败，召忽为他而死，我被囚禁受辱，鲍叔不认为我不知羞耻，知道我不以小节为羞，而以功名不能显扬于天下为耻。生我的是父母，懂我的是鲍叔啊。」鲍叔举荐管仲之后，甘心位居其下。天下人不称赞管仲的贤能，而称赞鲍叔能识人。",
 note:"「生我者父母，知我者鲍子也。」—— 识人的最高境界，是别人看见你的失败，他看见你的处境。",
 hint:"校园生活：好朋友做了一件「看起来很糟糕」的事，你会先问原因，还是先下结论？",
 tags:["识人","诚信"]},

{id:"tangju", dept:"胆智部", level:"🌿 进阶", title:"唐雎不辱使命",
 act1:"秦王使人谓安陵君曰：「寡人欲以五百里之地易安陵，安陵君其许寡人！」安陵君曰：「大王加惠，以大易小，甚善；虽然，受地于先王，愿终守之，弗敢易！」秦王不说。安陵君因使唐雎使于秦。秦王怫然怒，谓唐雎曰：「公亦尝闻天子之怒乎？天子之怒，伏尸百万，流血千里。」",
 act1v:"秦王派人对安陵君说：「我想用五百里的土地换安陵，安陵君可要答应我！」安陵君说：「大王施恩，以大换小，很好；虽然如此，我从先王手里继承了这块地，愿意一直守着，不敢交换！」秦王不高兴。安陵君于是派唐雎出使秦国。秦王勃然大怒，对唐雎说：「你听说过天子发怒吗？天子发怒，百万尸体倒下，血流千里。」",
 act2:"唐雎对曰：「大王尝闻布衣之怒乎？夫专诸之刺王僚也，彗星袭月；聂政之刺韩傀也，白虹贯日；要离之刺庆忌也，仓鹰击于殿上。此三子者，皆布衣之士也，怀怒未发，休祲降于天，与臣而将四矣。若士必怒，伏尸二人，流血五步，天下缟素，今日是也。」挺剑而起。秦王色挠，长跪而谢之。",
 act2v:"唐雎回答：「大王听说过平民发怒吗？专诸刺王僚，彗星的尾巴扫过月亮；聂政刺韩傀，白虹穿过太阳；要离刺庆忌，苍鹰扑到殿上。这三位都是平民中的勇士，心里的怒气未发，上天就降下征兆，现在加上我就是第四个了。勇士真发了怒，倒下的尸体只有两具，流血不过五步，天下人却要穿白戴孝——就在今天。」说完拔剑而起。秦王脸色变了，直身跪坐，向唐雎道歉。",
 note:"「挺剑而起。」—— 面对强权的恐吓，唐雎没有求饶，而是把「谁的代价更大」算给对方看。",
 hint:"思辨：别人用「你承担不起后果」吓唬你时，唐雎的应对是什么？这和逞强有什么不同？",
 tags:["勇气","应变"]},

{id:"xiangao", dept:"捷智部", level:"🌿 进阶", title:"弦高犒师",
 act1:"秦穆公使孟明视、西乞术、白乙丙潜师袭郑。郑商人弦高将市于周，遇秦师于滑。",
 act1v:"秦穆公派孟明视、西乞术、白乙丙率兵偷袭郑国。郑国商人弦高正要去周地做买卖，在滑国一带迎面遇上了秦军。",
 act2:"弦高曰：「若遽驰告，则师至国无备。」乃矫郑君之命，以十二牛犒劳秦师，曰：「寡君闻吾子将步师出于敝邑，敢犒从者。」且使人遽告于郑。秦将帅相顾曰：「郑已知之矣，备必成，攻之不克，围之不继。」遂灭滑而还。郑伯以存国之功赏弦高，弦高辞曰：「诞而得赏，则郑国之政废矣。」遂去之。",
 act2v:"弦高想：「如果赶回去报信，秦军到时郑国毫无防备。」于是假称奉郑君之命，用十二头牛犒劳秦军，说：「我们国君听说贵军要经过敝国，特派我来犒劳将士。」同时派人飞报郑国。秦军将领互相看了看说：「郑国已经知道了，必有防备，攻城攻不下，围困又缺后援。」于是灭了滑国就撤兵了。郑伯要奖赏弦高救国之功，弦高推辞说：「靠说谎而得赏，郑国的政事就败坏了。」便离开了郑国。",
 note:"「矫命犒师，诡道救国；事成而辞赏。」—— 急中生智救了国家，却不愿让「说谎有功」成为榜样。急智与诚实，他都守住了。",
 hint:"思辨：弦高救了国家靠的是「假装」——这个谎言该不该说？他后来为什么又拒绝领赏？",
 tags:["应变","诚信","思辨"]},

{id:"taokan", dept:"上智部", level:"🌱 入门", title:"陶侃运甓",
 act1:"陶侃为广州刺史，在州无事，辄朝运百甓于斋外，暮运于斋内。人问其故。",
 act1v:"陶侃任广州刺史时，州里太平无事，他就每天早晨把一百块砖搬到书房外面，傍晚又搬回书房里面。别人问他为什么这样做。",
 act2:"答曰：「吾方致力中原，过尔优逸，恐不堪事。」其励志勤力，皆此类也。后卒为东晋名臣，立功中原。",
 act2v:"陶侃回答：「我正立志收复中原，日子过得太安逸，恐怕将来担不起大事。」他磨砺意志、勤练不怠，都像这样。后来他果然成为东晋名臣，在中原立下大功。",
 note:"「过尔优逸，恐不堪事。」—— 没有大事的时候，正是为大事做准备的时候。",
 hint:"学习：放假在家「太舒服」的时候，陶侃会怎么想？你给自己的「一百块砖」可以是什么？",
 tags:["沉住气","格局"]},

{id:"laoma", dept:"察智部", level:"🌱 入门", title:"老马识途",
 act1:"管仲、隰朋从桓公伐孤竹，春往冬反，迷惑失道。",
 act1v:"管仲和隰朋跟随齐桓公征伐孤竹国，春天出发，冬天返回，在山里迷了路。",
 act2:"管仲曰：「老马之智可用也。」乃放老马而随之，遂得道。行山中无水，隰朋曰：「蚁冬居山之阳，夏居山之阴，蚁壤一寸而仞有水。」乃掘地，遂得水。",
 act2v:"管仲说：「老马的智慧可以利用。」于是放开几匹老马，队伍跟在后面，果然找到了路。行军山中没有水，隰朋说：「蚂蚁冬天住在山的南面，夏天住在北面，蚂蚁窝的土堆高一寸，下面八尺就有水。」于是掘地，果然找到了水。",
 note:"「老马之智可用也。」—— 经验是一种活的地图。放下身段向「老马」和「蚂蚁」学习，不丢人。",
 hint:"学习：遇到不会的题目，「问老师问同学」和「自己硬扛」，管仲会怎么选？为什么向有经验的人请教也是一种聪明？",
 tags:["智慧","思辨"]},

{id:"menghuo", dept:"兵智部", level:"🌿 进阶", title:"七擒孟获",
 act1:"诸葛亮南征，首战即擒孟获。亮使观于营阵之间，问曰：「此军何如？」获对曰：「向者不知虚实，故败。今蒙赐观看，若只如此，即定易胜耳。」亮笑，纵使更战。",
 act1v:"诸葛亮南征，第一战就活捉了孟获。诸葛亮带他在军营各处观看，问：「我这支军队怎么样？」孟获回答：「之前我不知道虚实，所以败了。今天承蒙让我看了，如果只是这样，我肯定很容易打赢。」诸葛亮笑了，放他回去再战。",
 act2:"凡七纵而七擒之，亮犹遣获。获止不去，曰：「公，天威也，南人不复反矣。」遂至滇池，南中平，皆即其渠率而用之。或谏，亮曰：「若留外人，则当留兵，兵留则无所食，一不易也；加夷新伤破，父兄死丧，留外人而无兵者，必成祸患，二不易也；又夷累有废杀之罪，自嫌衅重，若留外人，终不相信，三不易也。今吾欲使不留兵，不运粮，而纲纪粗定，夷汉粗安故耳。」",
 act2v:"一共七次放走又七次擒回，诸葛亮还要再放。孟获却不走了，说：「丞相天威，我们南人再也不反了。」大军到了滇池，南方平定，诸葛亮就让当地首领照旧管理本地。有人劝谏，诸葛亮说：「留外地人治理就要留兵，留兵就没有粮草，这是第一不行；夷人刚受战乱、父兄死伤，留外人而无兵保护，必成祸患，这是第二不行；夷人屡有冲突的旧账，疑虑很重，留了外人终究互不信任，这是第三不行。我要的是不留兵、不运粮，而法度初定、夷汉相安。」",
 note:"「七纵七擒，攻心为上。」—— 征服一个人最难的不是赢他，而是让他心服。",
 hint:"思辨：诸葛亮明明早就赢了，为什么还要放七次？「让人怕」和「让人服」，哪个更长久？",
 tags:["格局","识人"]},

{id:"wangmei", dept:"捷智部", level:"🌱 入门", title:"望梅止渴",
 act1:"魏武行役，失汲道，军皆渴。",
 act1v:"曹操率军行军，找不到取水的路，全军都渴得厉害。",
 act2:"乃令曰：「前有大梅林，饶子，甘酸可以解渴。」士卒闻之，口皆出水，乘此得及前源。",
 act2v:"曹操于是传令说：「前面有一大片梅林，梅子很多，又甜又酸，正好解渴。」士兵们听了，嘴里都流出口水，趁着这股劲儿赶到了前方的水源。",
 note:"「士卒闻之，口皆出水。」—— 心里先到了梅林，腿就到了水源。希望本身就是一种力气。",
 hint:"思辨：望梅止渴是「善意的谎言」吗？长跑或练琴坚持不下去时，你会给自己画一棵什么样的「梅林」？",
 tags:["智慧","应变"]},

{id:"youmeng", dept:"语智部", level:"🌿 进阶", title:"优孟衣冠",
 act1:"楚相孙叔敖死，其子贫困负薪。优孟即为孙叔敖衣冠，抵掌谈语，岁余，像孙叔敖。楚王置酒，优孟前为寿，庄王大惊，以为孙叔敖复生也，欲以为相。",
 act1v:"楚相孙叔敖死后，他的儿子穷得靠砍柴为生。优孟就穿戴起孙叔敖生前的衣帽，模仿他的言谈举止，练了一年多，活像孙叔敖。一次楚庄王设宴，优孟上前敬酒，庄王大吃一惊，以为孙叔敖复活了，想请他再做宰相。",
 act2:"优孟曰：「请归与妇计之。」三日后来曰：「妇言慎无为，楚相不足为也。如孙叔敖之为楚相，尽忠为廉以治楚，楚王得以霸。今死，其子无立锥之地，贫困负薪以自饮食。必如孙叔敖，不如自杀。」庄王谢之，乃召孙叔敖子，封之寝丘四百户。",
 act2v:"优孟说：「请让我回家和妻子商量一下。」三天后回来说：「我妻子说千万别当，楚相不值得做。像孙叔敖那样做楚相，尽忠廉洁治理楚国，楚王才得以称霸。如今他死了，他儿子却没有立锥之地，穷得砍柴为生。要是落得孙叔敖那样的下场，还不如自杀。」庄王听了惭愧认错，于是召来孙叔敖的儿子，把寝丘四百户封给了他。",
 note:"「楚相不足为也。」—— 优孟没有讲一句大道理，只是「演」给楚王看：好人被遗忘，是最有力的劝谏。",
 hint:"思辨：想提醒一个人做错了，「直接说」和「演给他看」哪个更有效？优孟的办法为什么能让楚王不生气？",
 tags:["智慧","应变"]},

{id:"chunyukun", dept:"语智部", level:"🌿 进阶", title:"淳于髡一鸣惊人",
 act1:"齐威王之时喜隐，好为淫乐长夜之饮，沉湎不治，委政卿大夫。百官荒乱，诸侯并侵，国且危亡，左右莫敢谏。淳于髡说之以隐曰：「国中有大鸟，止王之庭，三年不蜚又不鸣，王知此鸟何也？」",
 act1v:"齐威王在位时喜欢说隐语，又爱通宵饮酒作乐，沉迷不问政事，把国事都交给卿大夫。百官懈怠混乱，诸侯都来侵犯，国家眼看要亡，左右没人敢劝谏。淳于髡用隐语劝他说：「国中有一只大鸟，停在大王的庭院里，三年不飞也不叫，大王知道这是什么鸟吗？」",
 act2:"王曰：「此鸟不飞则已，一飞冲天；不鸣则已，一鸣惊人。」于是乃朝诸县令长七十二人，赏一人，诛一人，奋兵而出。诸侯振惊，皆还齐侵地。威行三十六年。",
 act2v:"威王说：「这只鸟不飞则已，一飞冲天；不鸣则已，一鸣惊人。」于是上朝召见七十二位县令县长，奖赏了一人，诛杀了一人，整军出战。诸侯大为震惊，纷纷把侵占的土地还给齐国。齐国的声威维持了三十六年。",
 note:"「说之以隐。」—— 劝一个听不进话的人，先给他一个谜语，让他自己说出答案。自己说出的道理，才会真的照做。",
 hint:"思辨：如果好朋友沉迷游戏成绩下滑，直接批评他会翻脸，你能像淳于髡一样，编一个「谜语」让他自己想明白吗？",
 tags:["智慧","应变"]},

{id:"zhaokuo", dept:"明智部", level:"🌳 挑战", title:"赵括纸上谈兵",
 act1:"赵括自少时学兵法，言兵事，以天下莫能当。尝与其父奢言兵事，奢不能难，然不谓善。括母问奢其故，奢曰：「兵，死地也，而括易言之。使赵不将括即已，若必将之，破赵军者必括也。」及括将行，其母上书言于王曰：「括不可使将。」王不听。",
 act1v:"赵括从小学习兵法，谈论起军事，认为天下没人辩得过他。他曾和父亲赵奢讨论兵法，赵奢辩不倒他，却不认为他真行。赵括的母亲问原因，赵奢说：「打仗是生死之地，赵括却把它说得太轻巧。赵国不让他做将军就罢了，如果一定让他做，毁掉赵军的一定是他。」到赵括要出征时，他母亲上书赵王说：「赵括不能当将军。」赵王不听。",
 act2:"括至长平，悉更约束，易置军吏。秦将白起闻之，纵奇兵，佯败走，而绝其粮道，分断其军为二，士卒离心。四十余日，军饿，赵括出锐卒自搏战，秦军射杀赵括。括军败，数十万之众遂降秦，秦悉坑之。赵前后所亡凡四十五万。",
 act2v:"赵括到了长平，把原有的规章制度全部改掉，撤换军官。秦将白起听说后，派出奇兵，假装败退，截断赵军粮道，把赵军分割成两段，士兵离心。四十多天后，赵军断粮，赵括亲自率精兵搏战，被秦军射死。赵军大败，几十万人投降秦国，全部被坑杀。赵国前后共损失四十五万人。",
 note:"「兵，死地也，而括易言之。」—— 谈起来头头是道，不等于做得到。警惕那些把难事说得很容易的人，包括自己。",
 hint:"思辨：背熟了游泳要领但没下过水的人，能算会游泳吗？学习里「听懂了」和「会做了」的区别是什么？",
 tags:["思辨","求真"]},

{id:"taizong", dept:"上智部", level:"🌿 进阶", title:"唐太宗吞蝗",
 act1:"贞观二年，京师旱，蝗虫大起。太宗入苑视禾，见蝗虫，掇数枚。",
 act1v:"贞观二年，京城大旱，蝗虫成灾。唐太宗到御苑查看庄稼，看见蝗虫，捉了几只在手里。",
 act2:"太宗祝曰：「人以谷为命，而汝食之，是害于百姓。百姓有过，在予一人。尔其有灵，但当蚀我心，无害百姓。」将吞之，左右遽谏曰：「恐成疾，不可。」太宗曰：「所冀移灾朕躬，何疾之避！」遂吞之。自是蝗不为灾。",
 act2v:"太宗对蝗虫说：「百姓以粮食为命，你们吃了粮食，就是害百姓。百姓的过错，在我一人身上。你们如果有灵，就只管咬我的心，不要害百姓。」说完就要吞下去，左右急忙劝谏：「恐怕要生病，不能吃。」太宗说：「我巴不得把灾祸移到自己身上，还避什么病！」于是吞了蝗虫。从此蝗虫不再成灾。",
 note:"「但当蚀我心，无害百姓。」—— 领导者的担当，是把灾祸往自己身上揽，而不是往别人身上推。",
 hint:"思辨：吞蝗虫当然治不了蝗灾，太宗为什么还要做？一个动作有时比一道命令更有用，这是为什么？",
 tags:["格局","勇气"]},

{id:"kongrong", dept:"捷智部", level:"🌿 进阶", title:"孔融小时了了",
 act1:"孔文举年十岁，随父到洛。时李元礼有盛名，为司隶校尉，诣门者皆俊才清称及中表亲戚乃通。文举至门，谓吏曰：「我是李府君亲。」既通，前坐。元礼问曰：「君与仆有何亲？」",
 act1v:"孔融十岁时，随父亲到洛阳。当时李膺（李元礼）名声极大，任司隶校尉，登门拜访的必须是俊才、名士或亲戚才给通报。孔融到了门前，对门吏说：「我是李府君的亲戚。」通报后进屋坐下。李膺问：「你和我有什么亲戚关系？」",
 act2:"对曰：「昔先君仲尼与君先人伯阳有师资之尊，是仆与君奕世为通好也。」元礼及宾客莫不奇之。太中大夫陈韪后至，人以其语语之，韪曰：「小时了了，大未必佳。」文举曰：「想君小时，必当了了。」韪大踧踖。",
 act2v:"孔融回答：「从前我的先人孔子和您的先人老子（伯阳）有师生之谊，所以我和您是世代的通家之好。」李膺和宾客没有不称奇的。太中大夫陈韪后到，别人把这话告诉他，陈韪说：「小时候聪明，长大了未必出色。」孔融应声说：「想必您小时候，一定很聪明吧。」陈韪顿时尴尬得说不出话。",
 note:"「想君小时，必当了了。」—— 对方的贬低，用他的逻辑还回去。机智不是逞口舌，是看清对方话里的破绽。",
 hint:"校园生活：被人当众泼冷水（比如「你现在好不代表以后好」），生气、不理、还是像孔融一样「用他的逻辑回敬」？分寸在哪里？",
 tags:["应变","智慧"]},

{id:"sunliang", dept:"察智部", level:"🌿 进阶", title:"孙亮辨蜜",
 act1:"孙亮方食生梅，使黄门至中藏取蜜渍梅，蜜中有鼠矢。亮问藏吏曰：「黄门从汝求蜜邪？」吏曰：「向求，实不敢与。」黄门不服。左右请付狱推。",
 act1v:"吴帝孙亮正要吃生梅子，派宦官到仓库取蜜来浸梅子，取来的蜜里有一颗老鼠屎。孙亮问管仓库的官吏：「宦官向你讨过蜜吗？」官吏说：「他来讨过，我实在不敢给他。」宦官拒不承认。左右的人请求把二人交狱官审问。",
 act2:"亮曰：「此易知耳。」令破鼠矢，矢里燥。亮大笑曰：「若矢先在蜜中，中外当俱湿；今外湿里燥，必是黄门所为。」黄门首服，左右莫不惊悚。",
 act2v:"孙亮说：「这很容易弄清楚。」让人剖开老鼠屎——里面还是干燥的。孙亮大笑说：「如果鼠屎早就落在蜜里，里外应该都湿透；现在外面湿、里面干，一定是宦官刚刚放进去的。」宦官磕头认罪，左右无不惊叹敬服。",
 note:"「外湿里燥，必是黄门所为。」—— 证据自己会说话，关键是知道看哪里。",
 hint:"思辨：班里东西被弄坏了，两个人说法不一样，不问谁哭得大声，该看什么？孙亮看的是「证据的细节」。",
 tags:["求真","思辨"]},

{id:"yangshi", dept:"语智部", level:"🌱 入门", title:"杨氏之子",
 act1:"梁国杨氏子九岁，甚聪惠。孔君平诣其父，父不在，乃呼儿出。为设果，果有杨梅。孔指以示儿曰：「此是君家果。」",
 act1v:"梁国有户杨家的孩子，九岁，非常聪明。孔君平来拜访他的父亲，父亲不在，就把孩子叫出来。孩子端出水果招待，水果里有杨梅。孔君平指着杨梅给孩子看，说：「这是你家的果子（杨梅，杨家的梅）。」",
 act2:"儿应声答曰：「未闻孔雀是夫子家禽。」",
 act2v:"孩子应声答道：「可没听说过孔雀是您家的鸟啊。」",
 note:"「未闻孔雀是夫子家禽。」—— 用「杨」对「孔」，不接招也不翻脸，轻轻一推，玩笑就还回去了。",
 hint:"校园生活：同学拿你的姓氏、名字开玩笑时，杨氏之子的回答妙在哪里？怎样既不失礼貌又不让自己难堪？",
 tags:["应变","智慧"]},

{id:"guoziyi", dept:"胆智部", level:"🌿 进阶", title:"郭子仪单骑退回纥",
 act1:"仆固怀恩诱回纥、吐蕃入寇，朝廷震恐。子仪时屯泾阳，兵才万人，虏围之数重。子仪使将士严备，自请出说回纥。左右请以铁骑五百卫从，子仪曰：「此适足为害也。」",
 act1v:"仆固怀恩引诱回纥、吐蕃入侵，朝廷震动。郭子仪当时驻守泾阳，兵力只有一万人，被敌军团团围了好几层。郭子仪让将士严加防备，自己请求出城去劝说回纥。部下请求派五百铁骑护卫随行，郭子仪说：「那样反而坏事。」",
 act2:"子仪免胄释甲，投枪而出，单骑见回纥。回纥诸酋长皆下马罗拜，曰：「果吾父也！」初，回纥误闻子仪已死、朝廷晏驾，故敢入寇；至是见子仪，皆惊。子仪责以大义，因说之共击吐蕃。回纥从之，吐蕃闻之，夜引兵遁去。",
 act2v:"郭子仪摘下头盔、解下铠甲、扔掉长枪，单人匹马走到回纥阵前。回纥的酋长们一见，全都下马围拜，说：「果然是我们的郭令公！」原来，回纥误听消息说郭子仪已死、皇帝已逝，才敢进犯；现在亲眼见到郭子仪，都惊呆了。郭子仪以大义相责，顺势劝他们掉头一起打吐蕃。回纥答应了，吐蕃闻讯，连夜撤兵逃走。",
 note:"「免胄释甲，单骑而出。」—— 最大的胆量，是敢于不披甲：他赌的是多年攒下的信义。",
 hint:"思辨：郭子仪的「单骑」靠的不是运气，是几十年攒下的什么？信誉平时看不见，关键时刻能退敌。",
 tags:["勇气","诚信","格局"]},

{id:"zhugeke", dept:"捷智部", level:"🌱 入门", title:"诸葛恪得驴",
 act1:"诸葛恪父瑾面长似驴。孙权大会群臣，使人牵一驴入，长检其面，题曰：「诸葛子瑜。」",
 act1v:"诸葛恪的父亲诸葛瑾脸很长，像驴脸。一次孙权大会群臣，让人牵进一头驴，在驴脸上挂了个长标签，题字：「诸葛子瑜」（诸葛瑾的字）。",
 act2:"恪跪曰：「乞请笔益两字。」因听与笔。恪续其下曰：「之驴。」举坐欢笑，乃以驴赐恪。",
 act2v:"诸葛恪跪下说：「请让我添两个字。」孙权就给他笔。诸葛恪在标签下面接着写了「之驴」二字——标签变成了「诸葛子瑜之驴」。满座大笑，孙权就把驴赏给了诸葛恪。",
 note:"「乞请笔益两字。」—— 别人的捉弄，加两个字就变成送给你的礼物。",
 hint:"校园生活：被起哄、被起外号时，诸葛恪的办法比生气高明在哪里？「接过来，改一笔」用在哪里合适？",
 tags:["应变","智慧"]},

{id:"yueyangzi", dept:"闺智部", level:"🌿 进阶", title:"乐羊子妻",
 act1:"河南乐羊子尝行路，得遗金一饼，还以与妻。妻曰：「妾闻志士不饮盗泉之水，廉者不受嗟来之食，况拾遗求利以污其行乎！」羊子大惭，乃捐金于野。",
 act1v:"河南人乐羊子有一次在路上捡到一块别人丢失的金子，回家交给妻子。妻子说：「我听说有志气的人不喝盗泉的水，廉洁的人不接受施舍的食物，何况捡别人丢的东西来牟利、玷污自己的品行呢！」乐羊子非常惭愧，就把金子扔回了野外。",
 act2:"羊子远寻师学，一年来归，妻跪问其故，羊子曰：「久行怀思，无它异也。」妻乃引刀趋机而言曰：「此织生自蚕茧，成于机杼。一丝而累，以至于寸，累寸不已，遂成丈匹。今若断斯织也，则捐失成功，稽废时日。夫子积学，当日知其所亡，以就懿德；若中道而归，何异断斯织乎？」羊子感其言，复还终业，遂七年不反。",
 act2v:"乐羊子外出求学，一年就回来了，妻子跪下问他缘故，他说：「出门太久想家，没有别的原因。」妻子就拿刀快步走到织机前说：「这织物从蚕茧抽丝开始，在织机上织成，一丝一丝积累成寸，一寸一寸积累成丈成匹。现在如果砍断这匹织物，就前功尽弃、荒废了时日。你积累学问，应当每天学到自己不懂的东西来成就美德；如果半途而废，和砍断这匹布有什么两样？」乐羊子被她的话感动，回去完成了学业，七年没有回家。",
 note:"「一丝而累，以至于寸。」—— 学问和织布一样，断一次，前功尽弃。",
 hint:"学习：练琴、背单词、读这本书，都是「织布」。中断一周会怎样？怎样才能让自己「不断丝」？",
 tags:["格局","沉住气","诚信"]},

{id:"xiean", dept:"上智部", level:"🌿 进阶", title:"谢安闻捷报",
 act1:"谢公与人围棋，俄而谢玄淮上信至，看书竟，默然无言，徐向局。客问淮上利害。",
 act1v:"谢安正和人下围棋，忽然谢玄从淮水前线派来的信使到了。谢安看完信，默不作声，慢慢又转向棋局。客人问前线战事如何。",
 act2:"答曰：「小儿辈大破贼。」意色举止，不异于常。—— 是时秦兵百万压境，京师震恐，朝野皆以安危系于谢安一身。既罢，还内，过户限，心喜甚，不觉屐齿之折。",
 act2v:"谢安淡淡回答：「孩子们把敌人打得大败。」神色举止，和平时毫无两样。—— 当时苻坚百万大军压境，京城震动，朝野上下都把安危系在谢安一人身上。等到下完棋回屋，过门槛时，他心里实在太高兴，连木屐的齿折断了都没发觉。",
 note:"「意色举止，不异于常。」—— 不是不激动，是知道自己一慌，全城都会慌。真正的镇定，是把情绪留到没人看见的地方。",
 hint:"思辨：谢安是装的吗？「把高兴和害怕藏起来」和「压抑情绪」有什么不同？什么时候必须沉住气？",
 tags:["沉住气","格局"]},

{id:"lihui", dept:"察智部", level:"🌿 进阶", title:"李惠拷皮",
 act1:"李惠为雍州刺史。人有负盐、负薪者，同释重担息于树阴。二人将行，争一羊皮，各言藉背之物。惠遣争者出，顾州纲纪曰：「以此羊皮可拷知主乎？」群下咸无答者。",
 act1v:"李惠任雍州刺史。有一个背盐的和一个背柴的，一同在树荫下放下重担休息。二人起身要走时，争抢一张羊皮，都说是自己垫背的东西。李惠让争的人先退出去，回头对州里的属官说：「拷打这张羊皮，能问出它的主人吗？」属官们都答不上来。",
 act2:"惠令人置羊皮席上，以杖击之，见少盐屑，曰：「得其实矣。」使争者视之，负薪者乃伏而就罪。",
 act2v:"李惠让人把羊皮放在席子上，用棍子敲打——掉出少许盐屑。李惠说：「真相出来了。」让争执的两人来看，背柴的人只得低头认罪。",
 note:"「拷打羊皮，得其盐屑。」—— 物证不会说谎，就看你会不会「问」。",
 hint:"思辨：这个故事和张举焚猪，思路有什么共同之处？「问不出答案时，让东西开口」还能用在什么生活场景？",
 tags:["求真","思辨"]},

{id:"chenyuanfang", dept:"语智部", level:"🌱 入门", title:"陈元方答客",
 act1:"陈太丘与友期行，期日中。过中不至，太丘舍去，去后乃至。元方时年七岁，门外戏。客问元方：「尊君在不？」答曰：「待君久不至，已去。」",
 act1v:"陈太丘和朋友约好一同出行，约定在正午。过了正午朋友还没到，太丘就先走了，走后朋友才到。陈元方当时七岁，正在门外玩。客人问元方：「你父亲在吗？」元方答：「等了您很久不来，已经走了。」",
 act2:"友人便怒曰：「非人哉！与人期行，相委而去。」元方曰：「君与家君期日中，日中不至，则是无信；对子骂父，则是无礼。」友人惭，下车引之，元方入门不顾。",
 act2v:"朋友便发怒说：「真不是人！跟人约好同行，却丢下人自己走了。」元方说：「您和我父亲约好正午，正午不到，就是不守信用；当着儿子的面骂他父亲，就是没有礼貌。」朋友惭愧，下车想拉元方，元方头也不回地进了家门。",
 note:"「无信」「无礼」—— 七岁孩子两句话，指出对方错在哪，一句不多，一句不少。讲道理不在声高，在条理。",
 hint:"校园生活：别人冲你发火时，「对骂回去」和「像元方一样指出他错在哪」，哪个更有力量？",
 tags:["诚信","思辨"]},

{id:"zongque", dept:"胆智部", level:"🌱 入门", title:"宗悫乘风破浪",
 act1:"宗悫，字元干，南阳人也。叔父炳，高尚不仕。悫年少时，炳问其志。",
 act1v:"宗悫，字元干，南阳人。叔父宗炳，品格高尚不愿做官。宗悫年少时，叔父问他的志向。",
 act2:"悫曰：「愿乘长风破万里浪。」炳曰：「汝不富贵，即破我家矣。」后兄泌娶妻，始入门，夜被劫，悫年十四，挺身拒贼，贼十余人皆披散，不得入室。及长，从征林邑，大破之，果成名将。",
 act2v:"宗悫回答：「愿乘长风破万里浪。」叔父说：「你将来不大富大贵，就是要闯大祸了。」后来他哥哥宗泌娶妻，新娘刚进门，夜里来了劫匪，十四岁的宗悫挺身而出抵挡，十几个劫匪都被打散，没能进屋。长大后随军征伐林邑，大获全胜，果然成了一代名将。",
 note:"「愿乘长风破万里浪。」—— 志向说出口的那一刻，就在逼你长大。",
 hint:"学习：「乘风破浪」听起来很远，如果让你现在说一句自己的「万里浪」，会是什么？",
 tags:["勇气","格局"]},

{id:"saiweng", dept:"明智部", level:"🌱 入门", title:"塞翁失马",
 act1:"近塞上之人有善术者，马无故亡而入胡。人皆吊之。",
 act1v:"边塞附近有个精通术数的人，他家的马无缘无故跑到了胡人那边。大家都来安慰他。",
 act2:"其父曰：「此何遽不为福乎？」居数月，其马将胡骏马而归。人皆贺之，其父曰：「此何遽不能为祸乎？」家富良马，其子好骑，堕而折其髀。人皆吊之，其父曰：「此何遽不为福乎？」居一年，胡人大入塞，丁壮者引弦而战，近塞之人，死者十九。此独以跛之故，父子相保。故福之为祸，祸之为福，化不可极，深不可测也。",
 act2v:"这老人说：「这怎么就不是福气呢？」过了几个月，那匹马带着胡人的骏马回来了。大家都来道贺，老人说：「这怎么就不是祸事呢？」家里多了好马，儿子爱骑，摔下来折断了大腿。大家又来安慰，老人说：「这怎么就不是福气呢？」过了一年，胡人大举入侵，青壮年都拉弓作战，边塞的人十个死了九个。唯独这家因为儿子腿跛，父子得以保全。所以说：福可变祸，祸可变福，变化没有穷尽，深不可测。",
 note:"「祸兮福所倚，福兮祸所伏。」—— 好事和坏事会互相转化，遇到坏事别绝望，遇到好事别飘。",
 hint:"学习：考试考砸了、比赛输了——用塞翁的思路想一想，里面可能藏着什么「福」？",
 tags:["思辨","沉住气"]},

{id:"ganluo", dept:"语智部", level:"🌿 进阶", title:"甘罗十二使赵",
 act1:"甘罗年十二，事秦相吕不韦。秦欲使张唐相燕，张唐不肯行。甘罗曰：「臣请行之。」吕不韦叱曰：「去！我身自请之而不肯，汝焉能行之？」甘罗曰：「大项橐生七岁为孔子师。今臣生十二岁于兹矣，君其试臣，何遽叱乎？」",
 act1v:"甘罗十二岁，在秦国丞相吕不韦门下做事。秦国想派张唐去燕国做相，张唐不肯去。甘罗说：「请让我去劝说他。」吕不韦呵斥道：「去！我亲自请他都不肯，你怎么能行？」甘罗说：「项橐七岁就做了孔子的老师。如今我已经十二岁了，您就让我试试，何必急着呵斥呢？」",
 act2:"甘罗见张唐曰：「卿之功孰与武安君？」唐曰：「臣之功不如也。」甘罗曰：「应侯欲攻赵，武安君难之，去咸阳七里而死杜邮。今文信侯自请卿相燕而不肯行，臣不知卿所死处矣。」张唐曰：「请因孺子行。」甘罗复说赵王，赵王悦，割五城以事秦。秦封甘罗以为上卿。",
 act2v:"甘罗见到张唐问：「您的功劳比得上武安君白起吗？」张唐说：「比不上。」甘罗说：「应侯要攻赵，白起不从，结果离开咸阳七里就死在杜邮。如今文信侯亲自请您去燕国为相您却不肯，我不知道您会死在哪里了。」张唐说：「那就听你这孩子的话，我去。」甘罗又出使游说赵王，赵王高兴，割让五座城池给秦国。秦王封甘罗为上卿。",
 note:"「君其试臣，何遽叱乎？」—— 年龄小不等于见识小，关键是敢开口、抓得住对方真正怕什么。",
 hint:"校园生活：大人说「你小孩子懂什么」时，甘罗的回答可以怎么用？说服别人，靠年纪还是靠道理？",
 tags:["勇气","智慧"]},

{id:"weijiujiuzhao", dept:"兵智部", level:"🌿 进阶", title:"围魏救赵",
 act1:"魏伐赵，赵急，请救于齐。齐威王以田忌为将，孙子为师。田忌欲引兵之赵。",
 act1v:"魏国攻打赵国，赵国危急，向齐国求救。齐威王任命田忌为将、孙膑为军师。田忌打算直接带兵去赵国。",
 act2:"孙子曰：「夫解杂乱纷纠者不控拳，救斗者不搏撠。今梁赵相攻，轻兵锐卒必竭于外，老弱罢于内。君不若引兵疾走大梁，据其街路，冲其方虚，彼必释赵而自救。是我一举解赵之围而收毙于魏也。」田忌从之。魏果去邯郸，与齐战于桂陵，大破梁军。",
 act2v:"孙膑说：「解开乱麻不能用拳头砸，劝架不能自己也加入打斗。如今魏赵相攻，魏国的精兵必定全在外线，国内只剩老弱。您不如带兵直扑魏国都城大梁，占据交通要道，攻击它空虚之处，魏军必定放弃赵国回来自救。这样我们一举就解了赵国之围，又能坐等魏军疲敝。」田忌听从了。魏军果然撤离邯郸，与齐军战于桂陵，齐军大破魏军。",
 note:"「批亢捣虚，攻其所必救。」—— 正面解不开的结，就去对方不得不回头的地方动手。",
 hint:"思辨：朋友被误会，你直接冲过去和误会他的人吵架，和围魏救赵的思路比，哪个更可能帮到他？",
 tags:["智慧","应变"]},

{id:"ximu", dept:"术智部", level:"🌿 进阶", title:"商鞅徙木立信",
 act1:"商鞅令既具，未布，恐民之不信己。",
 act1v:"商鞅的新法已经准备好了，还没有公布，他担心百姓不相信自己。",
 act2:"乃立三丈之木于国都市南门，募民有能徙置北门者予十金。民怪之，莫敢徙。复曰：「能徙者予五十金。」有一人徙之，辄予五十金，以明不欺。卒下令。商君治秦，法令至行，公平无私，秦人大悦，道不拾遗，国以富强。",
 act2v:"于是他在国都市场南门立起一根三丈高的木头，招募能把木头搬到北门的人，赏十金。百姓觉得奇怪，没人敢搬。又说：「能搬的赏五十金。」有一个人搬了，立刻赏他五十金，以此表明不欺骗。然后才颁布法令。商鞅治理秦国，法令得到彻底执行，公平无私，秦人非常高兴，路不拾遗，国家因此富强。",
 note:"「徙木予金，以明不欺。」—— 信任不是说出来的，是用一件「说到做到」的小事立起来的。",
 hint:"家庭日常：商鞅用一根木头立信。如果你说话经常不算数，别人以后还会信你吗？你的「五十金」可以是什么？",
 tags:["诚信","智慧"]},

{id:"wuyan", dept:"闺智部", level:"🌿 进阶", title:"无盐女说齐王",
 act1:"齐有妇人，极丑无双，号曰无盐女。自诣宣王，乞备后宫。说王曰：「妾，齐之不售女也，闻君王之圣德，愿备后宫之扫除。」左右莫不掩口大笑。",
 act1v:"齐国有个女子，丑得无人能比，人称无盐女。她自己求见齐宣王，请求入宫侍奉，对宣王说：「我是齐国嫁不出去的女子，听说君王圣德，愿意入宫做洒扫的宫女。」左右侍从没有不捂嘴大笑的。",
 act2:"无盐扬目衔齿，举手拊膝，连呼：「殆哉！殆哉！」王问其故，对曰：「今大王之国，西有衡秦之患，南有强楚之仇，外有三国之难，内聚奸臣，众人不附。一旦山陵崩，社稷不定，此一殆也。渐台五重，万人疲极，此二殆也。贤者伏匿，谄谀立朝，此三殆也。饮酒沉湎，以夜继昼，此四殆也。」宣王喟然而叹，拆渐台，罢女乐，退谄谀，进直言，拜无盐为后，齐国大安。",
 act2v:"无盐瞪大眼睛、露出牙齿，举手拍膝，连呼：「危险啊！危险啊！」宣王问缘故，她回答：「大王的齐国，西边有秦国之患，南边有强楚为仇，外有三国的进逼，朝廷里聚着奸臣，众人不肯归附，这是一险。修筑五层渐台，万人疲惫，这是二险。贤人隐居不出，谄媚小人立于朝堂，这是三险。日夜饮酒作乐，这是四险。」宣王长叹，拆掉渐台，停止歌舞，斥退谄臣，广开言路，拜无盐为王后，齐国从此安定。",
 note:"「殆哉！殆哉！」—— 众人笑她的脸，她却看见国家的险。真正的美，是看人看事的眼光。",
 hint:"思辨：别人用外貌评价人时，无盐的故事告诉我们该看什么？「被嘲笑」和「说真话」哪个更需要勇气？",
 tags:["勇气","识人","格局"]},

{id:"tiandan", dept:"兵智部", level:"🌿 进阶", title:"田单火牛阵",
 act1:"燕攻齐，下七十余城，唯莒、即墨未下。田单守即墨，乃收城中，得千余牛。",
 act1v:"燕国攻打齐国，连下七十多座城，只剩莒和即墨两城没有攻下。田单坚守即墨，在城中收集到一千多头牛。",
 act2:"为绛缯衣，画以五彩龙文，束兵刃于其角，而灌脂束苇于其尾，烧其端。凿城数十穴，夜纵牛，壮士五千人随其后。牛尾热，怒而奔燕军，所触尽死伤。燕军夜大惊，视牛皆龙文，齐人乘胜逐北，所过城邑皆畔燕而归田单，齐七十余城皆复。",
 act2v:"田单给牛披上红色绸衣，画上五彩龙纹，牛角绑上兵刃，牛尾捆上浸了油脂的芦苇，点燃末端。在城墙上凿开几十个洞，夜里放出牛群，五千壮士紧随其后。牛尾烧痛，发狂般冲向燕军，撞到的非死即伤。燕军夜里大惊，看牛身都是龙纹，齐人乘胜追击，所过城邑都叛燕归齐，七十多座城全部收复。",
 note:"「牛尾热，怒而奔燕军。」—— 绝境之中，田单看见的不是一千头牛，是一支奇兵。资源从来不在多少，在怎么用。",
 hint:"思辨：只剩一副烂牌的时候，田单没有弃局。你手里「不起眼的东西」能组合出什么？",
 tags:["智慧","应变","勇气"]},

{id:"zhuzhiwu", dept:"语智部", level:"🌿 进阶", title:"烛之武退秦师",
 act1:"晋侯、秦伯围郑，郑伯使烛之武见秦君。师必退。公从之。烛之武夜缒而出，见秦伯曰：「秦、晋围郑，郑既知亡矣。」",
 act1v:"晋文公、秦穆公联合围攻郑国，郑伯派烛之武去见秦穆公。烛之武夜里用绳子从城上吊下来出城，见到秦伯说：「秦、晋围攻郑国，郑国已经知道要灭亡了。」",
 act2:"「若亡郑而有益于君，敢以烦执事。越国以鄙远，君知其难也，焉用亡郑以陪邻？邻之厚，君之薄也。若舍郑以为东道主，行李之往来，共其乏困，君亦无所害。且君尝为晋君赐矣，许君焦、瑕，朝济而夕设版焉，君之所知也。夫晋，何厌之有？」秦伯说，与郑人盟，乃还。",
 act2v:"「如果灭掉郑国对您有好处，那就麻烦您动手吧。可是越过别国把远方的土地当边邑，您知道这很难——何必灭郑来扩大邻国的地盘呢？邻居变厚，就是您变薄啊。如果放过郑国，把它当作东方道路上的主人，使者往来，郑国供给所缺，对您没有害处。况且您曾施恩于晋君，晋君答应给您焦、瑕两地，早上渡过黄河晚上就筑城防备您，这是您知道的。晋国，什么时候满足过？」秦伯很高兴，与郑国结盟，撤兵回国。",
 note:"「邻之厚，君之薄也。」—— 烛之武不谈郑国多可怜，只算「秦国亏不亏」。说服别人，要站在对方的利益上说话。",
 hint:"思辨：想劝朋友别做一件傻事，说「这对你不好」和说「你不听就是对不起我」，烛之武会选哪个？为什么？",
 tags:["智慧","思辨"]},

{id:"ertao", dept:"杂智部", level:"🌳 挑战", title:"二桃杀三士",
 act1:"公孙接、田开疆、古冶子事景公，以勇力搏虎闻。晏子过而趋，三子者不起。晏子入见公曰：「此危国之器也，不若去之。」公曰：「三子者，搏之恐不得，刺之恐不中也。」晏子曰：「此皆力攻勍敌之人也，无长幼之礼。」因请公使人少馈之二桃，曰：「三子何不计功而食桃？」",
 act1v:"公孙接、田开疆、古冶子三人侍奉齐景公，以勇力搏虎闻名。晏子从他们面前小步快走过去致敬，三人却不起身回礼。晏子进宫对景公说：「这三人是危害国家的人物，不如除掉他们。」景公说：「这三个人，硬拼恐怕拼不过，刺杀恐怕刺不中。」晏子说：「他们都是凭蛮力对敌的人，不懂长幼之礼。」于是请景公派人赏他们两颗桃子，说：「三位何不按功劳大小来吃桃？」",
 act2:"公孙接曰：「吾再搏兽，功可食桃。」田开疆曰：「吾伏军却敌，功可食桃。」各援桃而起。古冶子曰：「吾尝从君济于河，鼋衔左骖以入砥柱之流，吾潜行水底，逆流百步，顺流九里，得鼋而杀之。若此之功，亦可以食桃而无与人同矣。二子何不反桃？」抽剑而起。公孙接、田开疆曰：「吾勇不子若，功不子逮，取桃不让，是贪也；然而不死，无勇也。」皆反其桃，挈领而死。古冶子曰：「二子死之，冶独生之，不仁；耻人以言而夸其声，不义。」亦挈领而死。",
 act2v:"公孙接说：「我两次搏杀猛兽，功劳可以吃桃。」田开疆说：「我埋伏军队打退敌人，功劳可以吃桃。」各自拿桃站起。古冶子说：「我曾随国君渡黄河，大鳖咬住左骖马潜入砥柱激流，我在水底潜行，逆流百步、顺流九里，杀了大鳖。这样的功劳，也该吃桃，不必与人分。你们两位何不把桃放回来？」拔剑而起。公孙接、田开疆说：「我们勇不如你、功不如你，拿桃不谦让，是贪；知道了还不死，是无勇。」都放回桃子，自刎而死。古冶子说：「两位死了，我独自活着，是不仁；用话羞辱别人而夸耀自己，是不义。」也自刎而死。",
 note:"这则故事要带着批判读：晏子用两颗桃子和「荣誉」二字，就让三条好汉自尽。智慧用错了地方，比刀还快。名声是别人给你戴的枷锁吗？",
 hint:"批判讨论：三位勇士死得值吗？如果有人用「你不够格」「你怕了」来激你，你怎么接？",
 tags:["思辨","批判","格局"]},

{id:"fanli", dept:"明智部", level:"🌳 挑战", title:"范蠡知进退",
 act1:"范蠡事越王勾践，苦身戮力，与勾践深谋二十余年，竟灭吴。还反国，范蠡以为大名之下，难以久居，且勾践为人可与同患，难与处安。",
 act1v:"范蠡侍奉越王勾践，尽心竭力，与勾践深谋二十多年，终于灭掉吴国。回到越国后，范蠡认为盛名之下难以久安，况且勾践这个人可以共患难，难以同安乐。",
 act2:"乃装其轻宝珠玉，自与其私徒属乘舟浮海以行，终不反。自齐遗大夫种书曰：「蜚鸟尽，良弓藏；狡兔死，走狗烹。越王为人长颈鸟喙，可与共患难，不可与共乐。子何不去？」种见书，称病不朝。人或谗种且作乱，越王乃赐种剑，种遂自杀。范蠡浮海出齐，变姓名，治产致数千万，世谓陶朱公。",
 act2v:"范蠡于是收拾细软宝珠，带着亲信乘船渡海离去，再也没有回来。他从齐国给大夫文种写信说：「飞鸟尽，良弓藏；狡兔死，走狗烹。越王生得长颈鸟喙，可以共患难，不可以共享乐。你为什么还不走？」文种见信，称病不上朝。有人进谗说文种要作乱，越王便赐剑给文种，文种自杀了。范蠡渡海到齐国，改名换姓，经营产业积累数千万，世人称他为陶朱公。",
 note:"「飞鸟尽，良弓藏。」—— 最难的智慧不是得到，是在最得意的时候看清「该走了」。文种没走，范蠡走了。",
 hint:"批判讨论：急流勇退是聪明还是不够忠诚？「功成身退」在友谊和团队里适用吗？",
 tags:["识人","格局","批判"]},

{id:"taokanmu", dept:"闺智部", level:"🌱 入门", title:"陶母封鲊",
 act1:"陶侃少为寻阳县吏，尝监鱼梁，以一坩鲊遗母。",
 act1v:"陶侃年轻时做寻阳县吏，曾经监管渔业，把一坛腌鱼送给母亲。",
 act2:"母湛氏封鲊付吏，反书责侃曰：「汝为吏，以官物见饷，非唯不能益吾，乃以增吾忧也。」",
 act2v:"母亲湛氏把腌鱼原样封好交还来人，回信责备陶侃说：「你做官，把公家的东西送给我，这不但不能让我受益，反而增添我的忧虑。」",
 note:"「非唯不能益吾，乃以增吾忧也。」—— 一坛腌鱼虽小，公家的东西就不是自己的。真正的为你好，是帮你守住底线。",
 hint:"家庭日常：如果爸爸妈妈把单位的东西拿回家给你用，陶母会怎么做？「小事没关系」和「守住底线」的界限在哪？",
 tags:["诚信","格局"]},

{id:"baozheng", dept:"察智部", level:"🌿 进阶", title:"包拯断牛舌",
 act1:"包拯知天长县。有盗割人牛舌者，主来告。",
 act1v:"包拯任天长知县。有个盗贼偷偷割了别人家牛的舌头，牛主人来报案。",
 act2:"拯曰：「第归，杀而鬻之。」寻复有来告私杀牛者，拯曰：「何为割牛舌而又告之？」盗惊服。—— 盖盗知牛主必惧其告发私杀，故先割舌使牛无用，诱其杀之以坐其罪也。",
 act2v:"包拯说：「你只管回去，把牛杀了卖肉。」不久果然有人来告发牛主人私杀耕牛，包拯说：「你为什么要割了人家牛的舌头，又来告他？」盗贼大惊，只得认罪。——原来盗贼知道牛主怕被告发私杀耕牛，所以先割牛舌让牛报废，引诱牛主杀牛，好借机陷害他。",
 note:"「何为割牛舌而又告之？」—— 包拯不找证据，而是给对手设了个局：谁最盼望牛主人犯错，谁就是凶手。",
 hint:"思辨：孙亮剖鼠屎、李惠拷羊皮、包拯「将计就计」——三个断案故事，办法有什么不同？各靠什么抓到真相？",
 tags:["求真","智慧","思辨"]},

{id:"wangjian", dept:"术智部", level:"🌳 挑战", title:"王翦请田宅",
 act1:"王翦将六十万人伐楚，始皇送至灞上。王翦行，请美田宅园池甚众。始皇大笑。翦既行，至关，使使还请善田者五辈。或曰：「将军之乞贷，亦已甚矣。」",
 act1v:"王翦率六十万大军伐楚，秦始皇送到灞上。王翦临行，请求赏给大量良田美宅园林池苑。始皇大笑。王翦出发后，到了武关，又接连五次派使者回朝请求赏田。部下说：「将军这样讨要赏赐，也太过分了。」",
 act2:"王翦曰：「不然。夫秦王怚而不信人。今空秦国甲士而专委于我，我不多请田宅为子孙业以自坚，顾令秦王坐而疑我邪？」",
 act2v:"王翦说：「不是这样的。秦王性格多疑，不轻易信人。如今他把全国的军队都交给我一个人，我如果不多多请求田宅作为子孙家业来表明心迹，岂不是让秦王坐朝堂上怀疑我吗？」",
 note:"「我不多请田宅……顾令秦王坐而疑我邪？」—— 读这则要想两面：王翦的「自污」保全了自己，但靠「装出贪心」来换取信任，是值得学的智慧，还是一种悲哀？",
 hint:"批判讨论：故意暴露「缺点」让别人放心——这种「自污」是聪明还是不诚实？今天还站得住脚吗？",
 tags:["思辨","批判","识人"]},

{id:"beishui", dept:"兵智部", level:"🌿 进阶", title:"韩信背水阵",
 act1:"韩信击赵，使万人先行，出，背水陈。赵军望见而大笑。诸将皆莫信，佯应曰：「诺。」",
 act1v:"韩信攻打赵国，派一万人先行，出了井陉口，背靠河水列阵。赵军望见都大笑不止。将领们都不相信这样能胜，只是假意应承。",
 act2:"信曰：「兵法不曰『陷之死地而后生，置之亡地而后存』？且信非得素拊循士大夫也，此所谓『驱市人而战之』，其势非置之死地，使人人自为战；今予之生地，皆走，宁尚可得而用之乎！」遂大破赵军。",
 act2v:"韩信说：「兵法不是说『陷之死地而后生，置之亡地而后存』吗？况且我来不及长期训练抚慰这些士兵，这叫做『赶着集市上的人去打仗』，这种形势下，非把他们放在死地，让人人为自己拼命不可；如果给他们留活路，全都跑了，还能用他们打仗吗！」于是大破赵军。",
 note:"「陷之死地而后生。」—— 没有了退路，潜力才肯出来。但别忘了：韩信敢用背水阵，是因为他先算准了全局。",
 hint:"思辨：「不给自己留退路」什么时候能激发潜力，什么时候是蛮干？韩信和你赌气说「不做完不睡觉」的区别在哪？",
 tags:["勇气","思辨","智慧"]},

{id:"dongfangshuo", dept:"杂智部", level:"🌿 进阶", title:"东方朔割肉",
 act1:"汉武帝伏日赐从官肉。大官丞日晏不来，东方朔独拔剑割肉，谓其同官曰：「伏日当蚤归，请受赐。」即怀肉去。大官奏之。朔入，上曰：「昨赐肉，不待诏，以剑割肉而去，何也？」朔免冠谢。",
 act1v:"汉武帝在三伏天赏赐侍从官员们肉。管分肉的官员天晚了还没来，东方朔独自拔剑割下一块肉，对同僚说：「伏天该早点回家，请接受这份赏赐。」就把肉揣着走了。分肉官把这事奏报皇上。东方朔进宫，皇上说：「昨天赐肉，你不等诏令，自己拔剑割肉就走，这是为什么？」东方朔脱帽谢罪。",
 act2:"上曰：「先生起自责也。」朔再拜曰：「朔来！朔来！受赐不待诏，何无礼也！拔剑割肉，一何壮也！割之不多，又何廉也！归遗细君，又何仁也！」上笑曰：「使先生自责，乃反自誉！」复赐酒一石，肉百斤，归遗细君。",
 act2v:"皇上说：「先生起来自我检讨吧。」东方朔拜了拜说：「朔啊！朔啊！接受赏赐不等诏令，多么无礼！拔剑割肉，多么豪壮！割得不多，多么廉洁！拿回家送给妻子，多么仁爱！」皇上笑了：「让你自我批评，你却反而自我表扬！」又赏他一石酒、一百斤肉，让他拿回家送妻子。",
 note:"「自责乃反自誉。」—— 东方朔把检讨说成了夸自己，逗笑了皇帝。读这一则可以讨论：用幽默化解批评，和「不认真认错」，界限在哪里？",
 hint:"批判讨论：东方朔是真的认错了吗？幽默能不能代替道歉？什么情况下幽默会火上浇油？",
 tags:["智慧","应变","批判"]},

{id:"xiaohe", dept:"明智部", level:"🌿 进阶", title:"萧何月下追韩信",
 act1:"韩信数与萧何语，何奇之。至南郑，诸将行道亡者数十人，信度何等已数言上，上不我用，即亡。何闻信亡，不及以闻，自追之。人有言上曰：「丞相何亡。」上大怒，如失左右手。",
 act1v:"韩信多次与萧何交谈，萧何认为他是奇才。汉军到南郑时，将领们在路上逃跑了几十人，韩信估量萧何等人已多次向汉王推荐自己，汉王却不重用，就也逃走了。萧何听说韩信跑了，来不及报告汉王，亲自去追。有人报告汉王说：「丞相萧何逃了。」汉王大怒，像失去了左右手。",
 act2:"居一二日，何来谒上。上且怒且喜，骂何曰：「若亡，何也？」何曰：「臣不敢亡也，臣追亡者。」上曰：「若所追者谁？」曰：「韩信也。」上复骂曰：「诸将亡者以十数，公无所追；追信，诈也。」何曰：「诸将易得耳，至如信者，国士无双。王必欲长王汉中，无所事信；必欲争天下，非信无所与计事者。」王乃拜信为大将。",
 act2v:"过了一两天，萧何回来拜见汉王。汉王又怒又喜，骂萧何说：「你逃跑，为什么？」萧何说：「我不敢逃，我是去追逃跑的人。」汉王问：「你追的是谁？」答：「韩信。」汉王又骂：「逃跑的将领有几十个，你一个都不追；追韩信，是骗人吧。」萧何说：「那些将领容易得到，至于韩信这样的人才，天下无双。大王如果只想长期在汉中称王，就用不着韩信；如果一定要争夺天下，除了韩信，没有能共图大事的人。」汉王于是拜韩信为大将。",
 note:"「国士无双。」—— 萧何识人，还敢于为「对的人」连夜奔跑。千里马常有，而伯乐不常有。",
 hint:"校园生活：班里选人才（排球队、辩论队）时，谁是你们的「萧何」？如果你看出了某人是人才，你敢不敢为他争取？",
 tags:["识人","格局"]},

{id:"wangxizhi", dept:"捷智部", level:"🌿 进阶", title:"羲之佯睡",
 act1:"王右军幼时，大将军王敦甚爱之，恒置帐中眠。大将军尝先出，右军犹未起。须臾钱凤入，屏人论事，都忘右军在帐中，便言逆节之谋。右军觉，既闻所论，知无活理。",
 act1v:"王羲之小时候，大将军王敦很疼爱他，常让他在自己帐中睡觉。有一次王敦先出去了，王羲之还没起床。一会儿钱凤进来，屏退旁人商议事情，完全忘了王羲之还在帐中，就说起了谋反的计划。王羲之醒来，听到这些，知道自己没有活命的道理。",
 act2:"乃剔吐污头面被褥，诈熟眠。敦论事造半，方忆右军未起，相与大惊曰：「不得不除之！」及开帐，乃见吐唾纵横，信其实熟眠，于是得全。",
 act2v:"王羲之就抠出口水弄脏头脸和被褥，假装熟睡。王敦议事议到一半，才想起王羲之还没起床，两人都大惊说：「不得不除掉他！」等到掀开帐子，却见口水狼藉，相信他确实睡得正熟，王羲之于是保住了性命。",
 note:"「剔吐污面，诈作熟眠。」—— 大难临头不能喊、不能跑的时候，先把「我什么都没听见」演到天衣无缝。",
 hint:"应变：遇到「不该听却听到」的危险时刻（比如撞见别人密谋欺负同学），你会怎么办？先保命还是先告发？",
 tags:["应变","沉住气","思辨"]},

{id:"zhangshizhi", dept:"察智部", level:"🌿 进阶", title:"张释之执法",
 act1:"汉文帝行出中渭桥，有一人从桥下走出，乘舆马惊。于是使骑捕，属之廷尉。释之治问，曰：「闻跸，匿桥下。久之，以为行已过，即出，见乘舆车骑，即走耳。」释之奏当：此人犯跸，当罚金。",
 act1v:"汉文帝出行经过中渭桥，有一个人从桥下跑出来，惊了皇帝车驾的马。于是派骑兵抓了他，交给廷尉张释之。张释之审问，那人说：「听到开道的命令，我躲在桥下。过了很久，以为车驾已经过去了，就出来，看见车驾还在，就跑开了。」张释之判决：此人冲犯皇帝车驾，应处罚金。",
 act2:"文帝怒曰：「此人亲惊吾马，吾马赖柔和，令他马，固不败伤我乎？而廷尉乃当之罚金！」释之曰：「法者，天子所与天下公共也。今法如此而更重之，是法不信于民也。且方其时，上使立诛之则已；今既下廷尉，廷尉，天下之平也，一倾而天下用法皆为轻重，民安所措其手足？」良久，上曰：「廷尉当是也。」",
 act2v:"文帝大怒说：「这个人惊了我的马，幸亏我的马性情温和，要是别的马，不就摔伤我了吗？廷尉却只判罚金！」张释之说：「法律，是天子和天下人共同遵守的。现在法律规定这样，却要从重处罚，法律就会失信于民。当时您让人立刻杀了也就罢了；如今既交给廷尉，廷尉是天下公平的标准，一旦倾斜，天下执法都会或轻或重，百姓手脚往哪里放？」过了很久，文帝说：「廷尉判得对。」",
 note:"「法者，天子所与天下公共也。」—— 最难得的不是判对一案，是敢对皇帝说「您也不能例外」。",
 hint:"思辨：如果你是法官，得罪「最大的人」和「按规则判」，哪个更重要？规则面前能不能有例外？",
 tags:["诚信","勇气","思辨"]},

{id:"youzhan", dept:"语智部", level:"🌱 入门", title:"优旃谏漆城",
 act1:"秦二世立，欲漆其城。优旃曰：「善。」",
 act1v:"秦二世即位后，想把城墙都漆一遍。优旃说：「好啊。」",
 act2:"优旃曰：「主上虽无言，臣固将请之。漆城虽于百姓愁费，然佳哉！漆城荡荡，寇来不能上。即欲就之，易为漆耳，顾难为荫室。」于是二世笑之，以其故止。",
 act2v:"优旃说：「您即使不说，我本来也要建议的。漆城虽然让百姓发愁破费，可是多好啊！漆好的城墙光溜溜的，敌人来了爬不上来。马上就能干成，刷漆容易，只不过难造一间给漆阴干的大屋子罢了。」于是秦二世笑了，因此作罢。",
 note:"「漆城荡荡，寇来不能上。」—— 顺着荒唐的主意说到更荒唐处，让皇帝自己笑出来，自己收回成命。",
 hint:"思辨：反对一个馊主意，「直接说不行」和「顺着它说到更荒唐」，哪个更可能让人改变主意？",
 tags:["智慧","应变"]},

{id:"fankuai", dept:"上智部", level:"🌿 进阶", title:"樊哙排闼",
 act1:"汉高祖尝病，恶见人，卧禁中，诏户者无得入群臣。群臣绛、灌等莫敢入。十余日。",
 act1v:"汉高祖曾患病，讨厌见人，躺在宫中，命令守门人不得放群臣进来。周勃、灌婴等大臣都不敢进去，这样过了十多天。",
 act2:"樊哙乃排闼直入，大臣随之。上独枕一宦者卧。哙等见上流涕曰：「始陛下与臣等起丰沛，定天下，何其壮也！今天下已定，又何惫也！且陛下病甚，大臣震恐，不见臣等计事，顾独与一宦者绝乎？」上笑而起。",
 act2v:"樊哙便推门径直闯进去，大臣们跟着进。皇上正独自枕着一个宦官躺着。樊哙等人见到皇上，流着泪说：「当初陛下和我们从丰沛起兵，平定天下，何等雄壮！如今天下已定，又何等疲惫！况且陛下病重，大臣们惶恐，您不见我们商议国事，难道只和一个宦官诀别吗？」皇上笑着起身了。",
 note:"「排闼直入。」—— 对长辈、对权威，真正的关心有时是「冒犯」：把不得不说的真话，当面说出来。",
 hint:"家庭日常：如果爸爸妈妈做了一个你认为不对的决定，忍着、顶撞、还是像樊哙一样「带着道理当面直说」？",
 tags:["勇气","诚信"]},

{id:"piaomu", dept:"闺智部", level:"🌱 入门", title:"漂母饭信",
 act1:"韩信始为布衣时，贫无行，常从人寄食饮，人多厌之者。尝钓于城下，诸母漂，有一母见信饥，饭信，竟漂数十日。",
 act1v:"韩信早年是平民时，穷困潦倒，常跟着别人蹭饭吃，很多人讨厌他。他曾在城下钓鱼，几位大娘在河边漂洗丝絮，其中一位大娘见韩信挨饿，就把饭分给他吃，一连几十天，直到漂洗完毕。",
 act2:"信喜，谓漂母曰：「吾必有以重报母。」母怒曰：「大丈夫不能自食，吾哀王孙而进食，岂望报乎！」及信为楚王，召所从食漂母，赐千金。",
 act2v:"韩信很高兴，对漂母说：「我将来一定重重报答您。」漂母生气地说：「大丈夫不能养活自己，我是可怜你才给你饭吃，难道指望你报答吗！」后来韩信封了楚王，召来当年给他饭吃的漂母，赐她千金。",
 note:"「吾哀王孙而进食，岂望报乎！」—— 不求回报的善意，才最贵重；而韩信的「赐千金」说明：记着别人的好，也是一种贵重。",
 hint:"家庭日常：别人帮你时没想过要你还，那你还要不要记着？「不图回报」和「知恩图报」矛盾吗？",
 tags:["仁心","诚信"]},

{id:"yuxu", dept:"兵智部", level:"🌿 进阶", title:"虞诩增灶",
 act1:"羌虏寇武都，邓太后以虞诩为武都太守。羌众数千遮诩于陈仓崤谷。诩军不进，宣言上书请兵，须到当发。羌闻之，乃分钞傍县。诩因其兵散，日夜进道，兼行百余里。",
 act1v:"羌人进犯武都，邓太后任命虞诩为武都太守。数千羌兵在陈仓崤谷拦截虞诩。虞诩下令停止前进，扬言已上书请求援兵，等援兵到了再走。羌兵听说后，就分散到邻县抢掠。虞诩趁羌兵分散，日夜兼程，一天赶路一百多里。",
 act2:"诩令吏士各作两灶，日增倍之，羌不敢逼。或问曰：「孙膑减灶而君增之，何也？」诩曰：「虏见我灶日增，必谓郡兵来迎。众多行速，必惮追我。孙膑见弱，吾今示强，势有不同故也。」既到郡，兵不满三千，而羌众万余，攻围赤亭数十日，终为诩所破。",
 act2v:"虞诩命令士兵每人垒两个灶，每天灶数加倍，羌兵不敢逼近。有人问：「孙膑用减灶，您却增灶，为什么？」虞诩说：「敌人见我灶一天天增多，必定认为郡兵来迎接我了。兵多行速，就不敢追。孙膑是故意示弱，我今天是故意示强——形势不同罢了。」到了郡城，兵力不满三千，而羌兵有一万多，围攻赤亭几十天，最终被虞诩击破。",
 note:"「孙膑见弱，吾今示强。」—— 同样的灶，能减也能增。学古人不是背答案，是学「看形势」的本事。",
 hint:"思辨：这则和《孙膑减灶》对着读——一模一样的办法，为什么一个要减、一个要增？「标准答案」和「看情况」你站哪边？",
 tags:["思辨","智慧","应变"]},

{id:"fengxuan", dept:"术智部", level:"🌿 进阶", title:"冯谖市义",
 act1:"孟尝君使冯谖收债于薛。谖辞曰：「债毕收，以何市而反？」孟尝君曰：「视吾家所寡有者。」",
 act1v:"孟尝君派冯谖到封地薛邑去收债。冯谖辞行时问：「债收完了，买些什么回来？」孟尝君说：「看我家缺什么就买什么。」",
 act2:"谖驱而之薛，使吏召诸民当偿者，悉来合券。券遍合，起，矫命以责赐诸民，因烧其券，民称万岁。孟尝君怪其疾也，衣冠而见之，曰：「债毕收乎？以何市而反？」冯谖曰：「臣窃计，君家所寡有者以义耳，窃以为君市义。」孟尝君不说。后期年，孟尝君就国于薛，未至百里，民扶老携幼迎君道中。孟尝君顾谓冯谖：「先生所为文市义者，乃今日见之。」",
 act2v:"冯谖驱车到了薛邑，派官吏召集所有欠债的百姓都来核对债券。核对完毕，他起身假传孟尝君的命令，把债款都赐给百姓，当场烧了债券，百姓欢呼万岁。孟尝君见他回来得这么快很奇怪，穿戴整齐接见他，问：「债收完了？买了什么回来？」冯谖说：「我私下盘算，您家缺的只是『义』罢了，就擅自为您买了义。」孟尝君很不高兴。一年后，孟尝君失势回到薛邑，还差一百里，百姓就扶老携幼在路旁迎接。孟尝君回头对冯谖说：「先生为我买的义，今天才看见。」",
 note:"「窃以为君市义。」—— 烧毁的是债券，换来的是人心。有些账不能按钱算。",
 hint:"思辨：冯谖自作主张烧了债券，主人当时很不高兴。如果「对的长远利益」和「主人的意愿」冲突，该不该自作主张？",
 tags:["格局","思辨","诚信"]},

{id:"jingpo", dept:"上智部", level:"🌱 入门", title:"将相和",
 act1:"蔺相如以功大，拜为上卿，位在廉颇之右。廉颇曰：「我为赵将，有攻城野战之大功，而蔺相如徒以口舌为劳，而位居我上。且相如素贱人，吾羞，不忍为之下！」宣言曰：「我见相如，必辱之。」相如闻，不肯与会。相如每朝时，常称病，不欲与廉颇争列。已而相如出，望见廉颇，相如引车避匿。",
 act1v:"蔺相如因功大被拜为上卿，位在廉颇之上。廉颇说：「我做赵国大将，有攻城野战的大功，蔺相如只凭口舌之劳，位次却在我之上。况且相如本是出身低微的人，我羞耻，不甘心在他之下！」扬言说：「我见到相如，一定羞辱他。」相如听说后，不肯与廉颇会面。每逢上朝，常称病，不想和廉颇争位次。后来相如出门，远远望见廉颇，就调转车子回避。",
 act2:"于是舍人相与谏曰：「臣所以去亲戚而事君者，徒慕君之高义也。今君与廉颇同列，廉君宣恶言，而君畏匿之，恐惧殊甚。」蔺相如曰：「公之视廉将军孰与秦王？」曰：「不若也。」相如曰：「夫以秦王之威，而相如廷叱之，辱其群臣。相如虽驽，独畏廉将军哉？顾吾念之，强秦之所以不敢加兵于赵者，徒以吾两人在也。今两虎共斗，其势不俱生。吾所以为此者，以先国家之急而后私仇也。」廉颇闻之，肉袒负荆，因宾客至蔺相如门谢罪，曰：「鄙贱之人，不知将军宽之至此也！」卒相与欢，为刎颈之交。",
 act2v:"于是门客们一齐劝谏说：「我们离开亲人来侍奉您，只因仰慕您的高义。如今您与廉颇同列，廉将军口出恶言，您却害怕躲着他，怕得太过分了。」蔺相如说：「你们看廉将军比秦王怎么样？」答：「不如秦王。」相如说：「凭秦王的威势，我尚且在朝堂上呵斥他，羞辱他的群臣。我即使无能，难道单怕廉将军吗？只是我想到：强秦之所以不敢对赵国用兵，只因为有我们两人在。如今两虎相斗，势必不能共存。我这样做的原因，是把国家的急难放在前，把私人的仇怨放在后。」廉颇听说后，光着上身背着荆条，由宾客领路到蔺相如门前请罪，说：「我这粗鄙的人，不知道将军宽容我到这种地步！」两人终于和好，成了生死之交。",
 note:"「先国家之急而后私仇。」—— 敢在秦王面前拼命的人，却肯对同僚低头。让，不是怕，是心里有更大的事。",
 hint:"校园生活：和同学闹矛盾时，「争一口气」和「先让一步」哪个更难？蔺相如让的是面子，守住的是什么？",
 tags:["格局","沉住气"]},

{id:"caogefa", dept:"杂智部", level:"🌳 挑战", title:"割发代首",
 act1:"曹操军行，经麦地，下令曰：「士卒无败麦，犯者死。」骑士皆下马，付麦以相持。",
 act1v:"曹操率军行进，经过麦田，下令说：「士兵不许踩坏麦子，违犯者处死。」骑兵都下马，扶着麦子小心通过。",
 act2:"操马腾入麦中，敕主簿议罪。主簿对以《春秋》之义，罚不加于尊。操曰：「制法而自犯之，何以帅下？然孤为军帅，不可自杀，请自刑。」因援剑割发以置地。",
 act2v:"曹操的马受惊闯进麦田，他命令主簿议自己的罪。主簿用《春秋》的道理回答：刑罚不加于尊者。曹操说：「制定法令自己却违犯，怎么统率部下？但我是军队主帅，不能自杀，请让我自行施刑。」于是拔剑割下头发扔在地上。",
 note:"这则要带着批判读：古人以发代首，士兵们觉得丞相够严明；可也有人说，「割发」终究不是「斩首」——法令对有权的人，到底算不算数？",
 hint:"批判讨论：班干部违反了班规，「自我批评一下」和「和大家一起受罚」，哪个才叫「规则面前人人平等」？",
 tags:["批判","思辨","诚信"]},

{id:"lichong", dept:"察智部", level:"🌿 进阶", title:"李崇断子",
 act1:"后魏李崇为扬州刺史。县人苟泰有子三岁，遇贼亡失，数年不知所在。后见在同县人赵奉伯家，泰以状告。各言己子，并有邻证，郡县不能断。",
 act1v:"北魏李崇任扬州刺史。县民苟泰有个三岁的儿子，遇贼丢失，几年不知下落。后来发现在同县人赵奉伯家里，苟泰写了状纸告官。两家都说孩子是自己的，又各有邻居作证，郡县官员无法决断。",
 act2:"崇令二父与儿各在别处，禁经数旬，然后遣人告之曰：「君儿遇患，向已暴死，有教解放，可出奔哀也。」苟泰闻即号啕，悲不自胜；奉伯咨嗟而已，殊无痛意。崇察知之，乃以儿还泰。",
 act2v:"李崇让两位父亲和孩子各住一处，隔离了几十天，然后派人分别告诉二人：「你儿子得了急病，刚刚突然死了。现在解除监禁，你可以出去奔丧了。」苟泰一听立刻放声痛哭，悲痛得不能自已；赵奉伯只是叹息几声，毫无悲痛之意。李崇观察得知，就把孩子判还给了苟泰。",
 note:"「苟泰号啕，奉伯咨嗟而已。」—— 真情装不出来，假意也装不像。判断一个人，看他的反应，胜过听他的言辞。",
 hint:"思辨：这个故事和「让东西开口」（拷羊皮）不同，李崇「问」的是人心。什么时候看物证，什么时候看反应？",
 tags:["识人","求真","思辨"]},

{id:"qibu", dept:"捷智部", level:"🌱 入门", title:"七步成诗",
 act1:"魏文帝曹丕尝令东阿王曹植七步中作诗，不成者行大法。",
 act1v:"魏文帝曹丕曾命令东阿王曹植在七步之内作出一首诗，作不成就处死刑。",
 act2:"应声便为诗曰：「煮豆持作羹，漉菽以为汁。萁在釜下燃，豆在釜中泣。本自同根生，相煎何太急！」帝深有惭色。",
 act2v:"曹植应声便作成一诗：「煮豆来做羹，滤豆取汤汁。豆秸在锅下燃烧，豆子在锅里哭泣：本是同根生长，煎熬何必这样急！」文帝听了，面露深深的愧色。",
 note:"「本自同根生，相煎何太急。」—— 七步之内，诗救了命，也让哥哥惭愧。才华真正的用处，是说进人心里。",
 hint:"家庭日常：兄弟姐妹、好朋友之间闹别扭时，「相煎何太急」这句话能用上吗？",
 tags:["智慧","思辨"]},

{id:"zhuzou", dept:"语智部", level:"🌿 进阶", title:"晏子数罪救烛邹",
 act1:"齐景公好弋，使烛邹主鸟而亡之。公怒，诏吏欲杀之。晏子曰：「烛邹有罪三，请数之以其罪而杀之。」公曰：「可。」",
 act1v:"齐景公喜欢射鸟，派烛邹管养鸟，鸟却飞走了。景公大怒，下令官吏杀烛邹。晏子说：「烛邹有三条罪状，请让我数落完他的罪再杀。」景公说：「可以。」",
 act2:"于是召而数之公前，曰：「烛邹！汝为吾君主鸟而亡之，是罪一也；使吾君以鸟之故杀人，是罪二也；使诸侯闻之，以吾君重鸟以轻士，是罪三也。」数烛邹罪已毕，请杀之。公曰：「勿杀，寡人闻命矣。」",
 act2v:"于是把烛邹召来，在景公面前数落他：「烛邹！你为君王管鸟却让鸟跑了，这是罪一；使我们君王因为一只鸟而杀人，这是罪二；让诸侯听说后，认为我们君王看重鸟而轻视士人，这是罪三。」数落完毕，晏子请求杀他。景公说：「不要杀了，我听懂你的意思了。」",
 note:"「是罪二也，是罪三也。」—— 晏子句句在骂烛邹，句句都在点醒景公。最高明的劝阻，是让下令的人自己收回命令。",
 hint:"思辨：晏子为什么不直接说「大王您错了」？给比你强势的人提意见，「直说」和「绕着说」各什么时候用？",
 tags:["智慧","应变"]},

{id:"yishang", dept:"明智部", level:"🌱 入门", title:"张良圯上受书",
 act1:"张良尝闲从容步游下邳圯上。有一老父，衣褐，至良所，直堕其履圯下，顾谓良曰：「孺子，下取履！」良鄂然，欲殴之。为其老，强忍，下取履。父曰：「履我！」良业为取履，因长跪履之。父以足受，笑而去。",
 act1v:"张良曾在下邳桥上从容散步。有个穿粗布衣的老人，走到张良面前，故意把鞋子掉到桥下，回头对张良说：「小子，下去给我捡鞋！」张良很惊讶，想打他。因为他是老人，强忍住，下去捡了鞋。老人说：「给我穿上！」张良已经捡了鞋，就跪下来给他穿上。老人伸出脚接受了，笑着离开。",
 act2:"父去里所，复还，曰：「孺子可教矣。后五日平明，与我会此。」五日平明，良往，父已先在，怒曰：「与老人期，后，何也？」去，曰：「后五日早会。」五日鸡鸣，良往，父又先在，复怒。去，曰：「后五日复早来。」五日，良夜未半往。有顷，父亦来，喜曰：「当如是。」出一编书，曰：「读此则为王者师矣。」遂去，不复见。旦日视其书，乃《太公兵法》也。",
 act2v:"老人走了一里左右，又回来，说：「这小子可以教。五天后天亮时，和我在这里相会。」五天后天亮，张良去了，老人已经先到，发怒说：「和老人约会，却迟到，为什么？」离开时说：「五天后再早点来。」五天后鸡一叫，张良就去了，老人又先到，再次发怒。离开时说：「五天后再更早来。」五天后，张良不到半夜就去了。过了一会儿，老人也来了，高兴地说：「应当这样。」拿出一编书，说：「读了这书就能做帝王的老师。」说完就走，再没出现。天亮看那书，是《太公兵法》。",
 note:"「孺子可教矣。」—— 老人考的不是捡鞋，是压不压得住火。能屈的人，才接得住大任。",
 hint:"校园生活：老师或长辈让你做一件「看起来委屈的小事」，先怼回去和先忍着做完，结果可能差多远？",
 tags:["沉住气","格局"]},

{id:"liangshang", dept:"上智部", level:"🌿 进阶", title:"梁上君子",
 act1:"陈寔在乡闾，平心率物。岁荒民俭，有盗夜入其室，止于梁上。寔阴见，乃起自整拂，呼命子孙，正色训之。",
 act1v:"陈寔在乡里，以公平之心待人。年成荒歉、百姓穷困，有个小偷夜里潜入他家，躲在房梁上。陈寔暗中看见了，就起身整理衣服，把子孙叫来，严肃地训话。",
 act2:"寔曰：「夫人不可不自勉。不善之人未必本恶，习以性成，遂至于此。梁上君子者是矣！」盗大惊，自投于地，稽颡归罪。寔徐譬之曰：「视君状貌，不似恶人，宜深克己反善。然此当由贫困。」令遗绢二匹。自是一县无复盗窃。",
 act2v:"陈寔说：「人不能不自我勉励。做坏事的人未必本性就恶，是习惯养成了性情，才到了这一步。梁上的君子就是这样啊！」小偷大惊，从梁上跳下来，磕头认罪。陈寔慢慢开导他说：「看你的相貌，不像坏人，应当努力克制自己、回心向善。不过你这样做，想必是因为贫困。」让人送给他两匹绢。从此全县再没有盗窃。",
 note:"「不善之人未必本恶。」—— 陈寔没有喊打喊杀，而是给了小偷一个台阶和两匹绢。点醒一个人，比惩罚一个人更有力量。",
 hint:"思辨：发现同学偷东西，「报告老师严惩」和「私下点醒给他改过的机会」，你会怎么选？宽厚的边界在哪里？",
 tags:["仁心","识人","格局"]},

{id:"zhaoyun", dept:"胆智部", level:"🌿 进阶", title:"赵云空营计",
 act1:"夏侯渊败，曹公争汉中地，运米北山下，数千万囊。黄忠可取，云兵随忠取米。忠过期不还，云将数十骑轻行出围，迎视忠等。值曹公扬兵大出，云为公前锋，击之，且斗且却。公军败，已复合，云陷敌，还趣围。",
 act1v:"夏侯渊兵败后，曹操来争汉中，运米到北山下，有数千万袋。黄忠带兵去夺米，赵云随行接应。黄忠过期未归，赵云率几十名骑兵出营迎探，正遇上曹操大军出动。赵云且战且退，曹军败而复聚，赵云突围回到营寨。",
 act2:"公军追至围，云入营，更大开门，偃旗息鼓。公军疑云有伏兵，引去。云雷鼓震天，惟以戎弩于后射公军，公军惊骇，自相蹂践，堕汉水中死者甚多。先主明旦自来至云营围视昨战处，曰：「子龙一身都是胆也。」",
 act2v:"曹军追到营前，赵云进营后，反而大开营门，放倒军旗、停止击鼓。曹军怀疑有伏兵，撤退了。赵云这才擂鼓震天，只用弓弩在后射曹军，曹军惊骇，自相践踏，掉进汉水淹死的很多。第二天刘备亲自到赵云营寨查看昨日战场，说：「子龙一身都是胆啊。」",
 note:"「更大开门，偃旗息鼓。」—— 这才是历史上真实的「空城计」。勇气不是不害怕，是把「我不怕」演给敌人看。",
 hint:"思辨：赵云大开营门是赌命吗？他凭什么判断曹军会退？「虚张声势」和「有底气的镇定」区别在哪？",
 tags:["勇气","应变"]},

{id:"zhuangxin", dept:"语智部", level:"🌱 入门", title:"亡羊补牢",
 act1:"庄辛谓楚襄王曰：「君王左州侯，右夏侯，辇从鄢陵君与寿陵君，专淫逸侈靡，不顾国政，郢都必危矣。」襄王曰：「先生老悖乎？」庄辛去之赵。留五月，秦果举鄢郢，襄王乃徵庄辛而谢之。",
 act1v:"庄辛对楚襄王说：「君王左边是州侯，右边是夏侯，车驾后跟着鄢陵君和寿陵君，一味享乐奢靡，不理国政，郢都一定危险了。」襄王说：「先生老糊涂了吗？」庄辛离开楚国去了赵国。待了五个月，秦军果然攻下鄢郢，襄王这才把庄辛请回来道歉。",
 act2:"庄辛曰：「臣闻鄙语曰：『见兔而顾犬，未为晚也；亡羊而补牢，未为迟也。』臣闻昔汤、武以百里昌，桀、纣以天下亡。今楚国虽小，绝长续短，犹以数千里，岂特百里哉？」襄王乃授庄辛为阳陵君，后用其计，颇收失地。",
 act2v:"庄辛说：「我听俗话说：『看见兔子再回头唤狗，不算晚；丢了羊再补羊圈，不算迟。』我听说从前商汤、周武王凭百里之地兴盛，夏桀、商纣坐拥天下却灭亡。如今楚国虽小，截长补短，还有几千里，何止百里呢？」襄王于是封庄辛为阳陵君，后来采用他的计谋，收复了不少失地。",
 note:"「亡羊而补牢，未为迟也。」—— 犯错不可怕，可怕的是犯了错还不改。承认错了，永远来得及。",
 hint:"学习：作业错了、计划断了，「算了反正已经晚了」和「现在就补上」，庄辛会怎么劝你？",
 tags:["思辨","沉住气"]},

{id:"fenshu", dept:"术智部", level:"🌿 进阶", title:"曹操焚书不问",
 act1:"官渡之战，曹操破袁绍。公收绍图书辎重，得许下及军中人书，皆与绍交通者。左右请按名收之。",
 act1v:"官渡之战，曹操击败袁绍。曹操缴获袁绍的图书和物资，发现其中有许都官员和自己军中人与袁绍私下往来的书信。左右请求按名单抓人。",
 act2:"公曰：「当绍之强，孤犹不能自保，而况众人乎！」皆焚之，不问。冀州诸郡多举城邑降者。",
 act2v:"曹操说：「当袁绍强大时，连我都不能自保，何况众人呢！」下令把书信全部烧掉，不再追究。冀州各郡纷纷举城投降。",
 note:"「皆焚之，不问。」—— 握住别人的把柄很容易，烧掉把柄需要胸襟。有时候，忘记比记得更有力量。",
 hint:"思辨：如果你掌握了同学的一个「黑历史」，说出来、要挟他、还是「烧掉」？曹操烧信是仁慈还是收买人心？",
 tags:["格局","仁心","批判"]},

{id:"quji", dept:"捷智部", level:"🌿 进阶", title:"区寄杀贼",
 act1:"童区寄者，郴州荛牧儿也。行牧且荛，二豪贼劫持，反接，布囊其口，去逾四十里，之虚所卖之。寄伪儿啼，恐栗，为儿恒状。贼易之，对饮酒，醉。一人去为市；一人卧，植刃道上。",
 act1v:"儿童区寄，是郴州一个打柴放牛的孩子。他正在放牧打柴，被两个强贼劫持，反绑双手，用布堵住嘴，带到四十里外，准备到集市上卖掉。区寄假装像小孩一样啼哭，害怕发抖，装出平常孩子的样子。贼人放松了警惕，相对喝酒，喝醉了。一个贼去集市谈买卖，另一个躺下睡觉，把刀插在路上。",
 act2:"童微伺其睡，以缚背刃，力上下，得绝；因取刃杀之。逃未及远，市者还，得童，大骇，将杀童。遽曰：「为两郎僮，孰若为一郎僮耶？彼不我恩也；郎诚见完与恩，无所不可。」市者良久计曰：「与其杀是僮，孰若卖之？与其卖而分，孰若吾得专焉？」是贼少恩，遂留之。夜半，童自转，以缚即炉火烧绝之，复取刃杀市者。因大号，一虚皆惊。童以闻于官，刺史颜证奇之，留为小吏，不肯。与衣裳，吏护还之乡。",
 act2v:"区寄偷偷看他睡着了，把绑手的绳子靠在刀刃上，用力上下磨，磨断了；就拿起刀杀了睡着的贼。没逃多远，去集市的贼回来，抓住区寄，大惊，要杀他。区寄急忙说：「做两个人的仆人，哪比得上做一个人的仆人呢？他对我不好；您若真能保全我、对我好，怎么都行。」那贼盘算了很久：「与其杀这孩子，不如卖掉他；与其卖掉分钱，不如我独吞。」便留下他。半夜，区寄自己转身，把绳子凑到炉火上烧断，再拿刀杀了那个贼。然后大声呼喊，全集市都惊动了。区寄把事情报官，刺史颜证很赏识他，留他做小吏，他不肯。官府赠他衣裳，派官吏护送他回乡。",
 note:"「伪儿啼，为儿恒状。」—— 十一岁的孩子，先用「示弱」卸下贼的防备，再用「利」离间两个贼。急中生智，层层递进。",
 hint:"思辨：区寄的每一步（装哭、磨绳、离间、烧绳）都在为下一步铺路。遇到危险，「冷静」具体要做什么？",
 tags:["勇气","应变","智慧"]},

{id:"jianshu", dept:"明智部", level:"🌿 进阶", title:"蹇叔哭师",
 act1:"杞子自郑使告于秦曰：「郑人使我掌其北门之管，若潜师以来，国可得也。」穆公访诸蹇叔。蹇叔曰：「劳师以袭远，非所闻也。师劳力竭，远主备之，无乃不可乎？师之所为，郑必知之。勤而无所，必有悖心。且行千里，其谁不知？」公辞焉。",
 act1v:"杞子从郑国派人报告秦穆公说：「郑国人让我掌管他们北门的钥匙，如果偷偷派兵来，郑国可以拿下。」穆公就此事咨询蹇叔。蹇叔说：「让军队疲劳去袭击远方，没听说过能成的。军队劳累、力量耗尽，远方的君主又有防备，恐怕不行吧？军队的一举一动，郑国必定知道。劳而无功，必有怨心。况且行军千里，谁会不知道？」穆公不听。",
 act2:"召孟明、西乞、白乙，使出师于东门之外。蹇叔哭之，曰：「孟子！吾见师之出而不见其入也！」蹇叔之子与师，哭而送之曰：「晋人御师必于崤。崤有二陵焉，吾将收尔骨焉。」秦师遂东。—— 及滑，郑商人弦高犒师，郑有备矣。秦师还，晋败之于崤，匹马只轮无反者。",
 act2v:"穆公召孟明视、西乞术、白乙丙，派他们从东门外出兵。蹇叔哭着说：「孟明啊！我看见大军出发，却看不见它回来了！」蹇叔的儿子也在军中，他哭着送儿子说：「晋国人必定在崤山阻击我军。崤有两座山陵，我到那里去收你的尸骨吧。」秦军于是东进。——到了滑国，郑国商人弦高犒劳秦军，郑国有了防备。秦军回师，晋国在崤山大败秦军，全军覆没，连一匹马一只车轮都没回去。",
 note:"「吾见师之出而不见其入也。」—— 老臣的哭谏没人听。看远的人总是孤独的，但时间会替他作证。",
 hint:"思辨：如果大多数人都说「没事」，只有一个人坚决反对，该听谁的？怎样判断反对意见是「乌鸦嘴」还是「真远见」？",
 tags:["思辨","格局","求真"]},

{id:"dengai", dept:"兵智部", level:"🌿 进阶", title:"邓艾偷渡阴平",
 act1:"邓艾伐蜀，请从阴平由邪径经汉德阳亭趣涪，出剑阁西百里，去成都三百余里。自阴平道行无人之地七百余里，凿山通道，造作桥阁。山高谷深，至为艰险，又粮运将匮，频于危殆。",
 act1v:"邓艾伐蜀，请求从阴平走小路经汉德阳亭直取涪县，出剑阁以西一百里，离成都三百多里。从阴平道行军，穿越七百多里无人之地，凿山开路，架设栈道桥梁。山高谷深，极其艰险，军粮又快耗尽，多次濒临绝境。",
 act2:"艾以毡自裹，推转而下。将士皆攀木缘崖，鱼贯而进。先登至江由，蜀守将马邈降。蜀卫将军诸葛瞻列阵待艾。艾遣子忠等出其右，司马师纂等出其左。忠、纂战不利，并退还，曰：「贼未可击。」艾大怒曰：「存亡之分，在此一举，何不可之有！」乃叱忠、纂等，将斩之。忠、纂驰还更战，大破之，斩瞻。蜀主刘禅降，蜀亡。",
 act2v:"邓艾用毛毡裹住自己，从山上翻滚而下。将士们都攀着树木、贴着悬崖，一个跟一个前进。先头到达江由，蜀守将马邈投降。蜀卫将军诸葛瞻列阵迎战。邓艾派儿子邓忠等攻右翼，司马师纂等攻左翼。邓忠、师纂作战不利，一同退回，说：「敌人不可攻击。」邓艾大怒说：「生死存亡，在此一举，有什么不可！」喝斥邓忠、师纂，要将他们斩首。二人驰马回阵再战，大破蜀军，斩杀诸葛瞻。蜀主刘禅投降，蜀国灭亡。",
 note:"「存亡之分，在此一举。」—— 所有人说「过不去」的地方，恰恰是没人设防的地方。",
 hint:"思辨：别人都觉得「太难了做不到」的事，邓艾赌赢了。冒险和鲁莽的界限，他和赵括的输在哪里不一样？",
 tags:["勇气","思辨"]},

{id:"xuyunfu", dept:"闺智部", level:"🌿 进阶", title:"许允妇救夫",
 act1:"许允为吏部郎，多用其乡里，魏明帝遣虎贲收之。其妇出诫允曰：「明主可以理夺，难以情求。」既至，帝核问之，允对曰：「『举尔所知』，臣之乡人，臣所知也。陛下检校，为称职与不？若不称职，臣受其罪。」",
 act1v:"许允任吏部郎，任用了很多同乡，魏明帝派武士来抓他。他妻子阮氏追出来告诫许允：「贤明的君主可以用道理说服，难以用私情求告。」到了朝廷，明帝核查审问，许允回答：「孔子说『举荐你所了解的人』，我的同乡，是我了解的人。陛下可以考察，他们是否称职？若不称职，我甘愿领罪。」",
 act2:"既检校，皆官得其人，于是乃释允。初，允被收，举家号哭，阮氏自若，曰：「勿忧，寻还。」作粟粥待。顷之，允至。",
 act2v:"经过核查，所用之人都称职，明帝于是放了许允。当初许允被抓时，全家号啕大哭，阮氏镇定自若，说：「不要担心，不久就回来了。」还煮了小米粥等他。不久，许允果然到家。",
 note:"「明主可以理夺，难以情求。」—— 对讲道理的人，用道理赢他；哭喊求饶反而没用。看人下菜，不是势利，是明白。",
 hint:"思辨：被误会时，「哭着解释」和「摆事实讲道理」，什么时候哪个管用？阮氏为什么能笃定丈夫会回来？",
 tags:["智慧","沉住气","思辨"]},

{id:"sunwuming", dept:"察智部", level:"🌿 进阶", title:"苏无名捕盗",
 act1:"太平公主细器宝物两食盒，价值黄金千镒，被盗。天后大怒，特令洛州长史三日内擒贼。长史惧，召吏卒。吏卒游徼，遇湖州别驾苏无名，素知其能，请与相见。无名曰：「请宽其限，勿急吏卒。」",
 act1v:"太平公主的两盒珍宝细软，价值千镒黄金，被盗。武则天大怒，特令洛州长史三日内捉拿盗贼。长史害怕，召集吏卒。吏卒在街市遇到湖州别驾苏无名，久闻其能，请他相助。苏无名说：「请放宽期限，不要催逼吏卒。」",
 act2:"无名乃命吏卒察胡人出殡者。见胡人十余辈，举柩出北邙山，至冢所，哭而不哀。既彻奠，相视而笑。无名曰：「得之矣。」使人发其冢，剖其棺，宝物尽在其中。擒其党十余人。后问其故，无名曰：「胡人之哭，声不哀切；撤祭之时，相视而笑。是知柩中无尸，乃赃也。若急之，贼必取宝潜逃；缓之，彼必不虞，故迟留也。」",
 act2v:"苏无名命吏卒暗中观察出殡的胡人。见十多个胡人抬棺出北邙山，到了墓地，哭声却不悲哀。撤掉祭品后，互相看着笑了。苏无名说：「抓到了。」命人挖开坟冢，劈开棺材，宝物全在里面。擒获同党十多人。事后问他缘故，苏无名说：「胡人哭丧，声音不哀切；撤祭时，相视而笑。可知棺中无尸，是赃物。如果催得紧，贼必携宝潜逃；放缓了，他们毫不提防，所以拖延。」",
 note:"「哭而不哀，相视而笑。」—— 破绽藏在「不合常理」里。办丧事却不悲伤，这个「不对劲」就是线头。",
 hint:"思辨：苏无名抓贼靠的是「宽限」——越急越办不成。你写作业越催越乱时，和这个有没有相通之处？",
 tags:["求真","沉住气","思辨"]},

{id:"yongchi", dept:"上智部", level:"🌿 进阶", title:"刘邦封仇人",
 act1:"汉六年，高祖已封大功臣二十余人，其余日夜争功不决，未得行封。上在洛阳南宫，从复道望见诸将往往相与坐沙中语。上曰：「此何语？」留侯曰：「陛下不知乎？此谋反耳。陛下起布衣，以此属取天下。今所封皆萧、曹故人所亲爱，而所诛者皆生平所仇怨。此属畏陛下不能尽封，恐又见疑平生过失及诛，故即相聚谋反耳。」上乃忧曰：「为之奈何？」",
 act1v:"汉六年，高祖已封大功臣二十多人，其余的人日夜争功不决，未能进行封赏。高祖在洛阳南宫，从阁道上望见将领们常常三五成群坐在沙地上议论。高祖问：「他们在说什么？」留侯张良说：「陛下不知道吗？这是在谋反啊。陛下以布衣起家，靠这些人取得天下。如今所封的都是萧何、曹参这些亲信故人，所杀的都是生平仇怨。这些人怕陛下不能全部封赏，又担心被怀疑平生过失而遭诛杀，所以相聚谋反。」高祖忧虑地问：「怎么办？」",
 act2:"留侯曰：「上平生所憎，群臣所共知，谁最甚者？」上曰：「雍齿与我故，数尝窘辱我。我欲杀之，为其功多，故不忍。」留侯曰：「今急先封雍齿以示群臣，群臣见雍齿封，则人人自坚矣。」于是上乃置酒，封雍齿为什方侯，而急趣丞相、御史定功行封。群臣罢酒，皆喜曰：「雍齿尚为侯，我属无患矣。」",
 act2v:"张良说：「陛下平生最憎恶、群臣都知道的，是谁？」高祖说：「雍齿和我有旧怨，多次使我窘迫受辱。我想杀他，因他功劳多，不忍。」张良说：「现在就赶紧先封雍齿给群臣看，群臣见雍齿都封了，就会人人安心。」于是高祖设酒宴，封雍齿为什方侯，并催促丞相、御史赶快评定功劳进行封赏。群臣散宴后，都高兴地说：「雍齿尚且封侯，我们这些人无忧了。」",
 note:"「雍齿尚为侯，我属无患矣。」—— 封赏一个仇人，安定了所有人心。最高明的收买，是做给旁观者看的。",
 hint:"思辨：刘邦恨雍齿却先封他，这是虚伪还是大度？「忍下私人恩怨顾全大局」，你能想到生活里的例子吗？",
 tags:["格局","识人"]},

{id:"liguang", dept:"胆智部", level:"🌿 进阶", title:"李广解鞍却敌",
 act1:"李广出雁门击匈奴，匈奴兵多，破败广军，生得广。广时伤病，置广两马间，络而盛卧广。行十余里，广详死，睨其旁有一胡儿骑善马，广暂腾而上胡儿马，因推堕儿，取其弓，鞭马南驰数十里，复得其余军。",
 act1v:"李广出雁门攻打匈奴，匈奴兵多，打败李广军，活捉了李广。李广当时受伤生病，匈奴把他放在两马之间，用绳编成网兜让他躺着。走了十多里，李广装死，斜眼看见旁边一个匈奴少年骑着好马，李广突然跃身跳上少年的马，把他推下马，夺了他的弓，打马向南奔驰几十里，重新会合残军。",
 act2:"后广为右北平太守，匈奴号之「飞将军」，避之数岁。尝以百骑出，遇匈奴数千骑。广之百骑皆大恐，欲驰还走。广曰：「吾去大军数十里，今如此以百骑走，匈奴追射我立尽。今我留，匈奴必以我为大军之诱，必不敢击我。」广令诸骑曰：「前！」前未到匈奴陈二里所，止，令曰：「皆下马解鞍！」其骑曰：「虏多且近，即有急，奈何？」广曰：「彼虏以我为走，今皆解鞍以示不走，用坚其意。」于是胡骑遂不敢击。夜半时，胡兵以为汉有伏军于旁欲夜取之，皆引兵而去。",
 act2v:"后来李广任右北平太守，匈奴称他「飞将军」，躲避他好几年。他曾率百名骑兵出行，遭遇数千匈奴骑兵。李广的百名骑兵都大为惊恐，想驰马逃跑。李广说：「我们离大军几十里，如今这样凭百骑逃跑，匈奴追射，我们立刻全灭。现在我们留下，匈奴必定以为我们是大军的诱饵，必不敢攻击。」李广命令骑兵：「前进！」前进到离匈奴阵地二里处停下，下令：「都下马解鞍！」骑兵说：「敌人多又近，若有紧急情况，怎么办？」李广说：「敌人以为我们会逃，现在都解下马鞍表示不逃，用以坚定他们的疑虑。」于是匈奴骑兵始终不敢攻击。半夜时，匈奴以为汉军有伏兵在旁要夜袭，全部撤兵离去。",
 note:"「解鞍以示不走，用坚其意。」—— 越镇定，敌人越多疑。恐惧会传染，镇定也会。",
 hint:"思辨：李广的镇定和赵云的空营，靠的都是「反着来」。为什么「反常」会让对手害怕？",
 tags:["勇气","应变","沉住气"]},

{id:"chenping", dept:"杂智部", level:"🌿 进阶", title:"陈平裸身渡江",
 act1:"陈平亡楚归汉，渡河。船人见其美丈夫独行，疑其亡将，腰中当有金玉宝器，目之，欲杀平。",
 act1v:"陈平逃离楚军投奔汉王，渡黄河。船夫见他是个魁梧的美男子独自赶路，怀疑他是逃亡的将领，腰间一定藏着金玉宝物，眼睛盯着他，起了杀心。",
 act2:"平恐，乃解衣裸而佐刺船。船人知其无有，乃止。",
 act2v:"陈平害怕，就脱下衣服光着上身帮船夫划船。船夫见他身上确实一无所有，才打消了念头。",
 note:"「解衣裸而佐刺船。」—— 对方图财，就让他一眼看清「无财可图」。消除危险最好的办法，是消除对方的动机。",
 hint:"思辨：陈平没有搏斗也没有求饶，他消除了什么？遇到「被盯上」的危险，硬拼、逃跑、化解动机，哪个最聪明？",
 tags:["应变","智慧"]},

{id:"mengmu", dept:"闺智部", level:"🌱 入门", title:"孟母三迁",
 act1:"孟子幼时，其舍近墓，常嬉为墓间之事，踊跃筑埋。孟母曰：「此非所以居子也。」乃去。舍市旁，其嬉为贾人炫卖之事。孟母又曰：「此非所以居子也。」",
 act1v:"孟子小时候，家在墓地附近，他常玩殡葬的游戏，学人筑坟埋棺。孟母说：「这不是适合孩子住的地方。」就搬走了。住在集市旁边，孟子又学商人叫卖做生意。孟母又说：「这也不适合孩子住。」",
 act2:"复徙居学宫之旁。其嬉乃设俎豆，揖让进退。孟母曰：「真可以居吾子矣。」遂居。及孟子长，学六艺，卒成大儒。",
 act2v:"又搬到学校旁边。孟子就玩起了摆设祭器、作揖礼让的游戏。孟母说：「这里才真正适合我的孩子住。」于是定居下来。孟子长大后，学习六艺，终于成为一代大儒。",
 note:"「真可以居吾子矣。」—— 孟母搬了三次家，赌的是：环境不说话，却在天天塑造人。",
 hint:"家庭日常：你的书桌旁、你的朋友圈，是「学宫旁」还是「集市旁」？环境怎样悄悄影响你？",
 tags:["格局","识人"]},

{id:"mochong", dept:"察智部", level:"🌿 进阶", title:"摸钟辨盗",
 act1:"陈述古知建州浦城县，有人失物，捕得数人，莫知的为盗者。述古乃绐之曰：「某庙有一钟，能辨盗，至灵。」使人迎置后阁祠之，引群囚立钟前，自陈：「不为盗者，摸之则无声；为盗者，摸之则有声。」",
 act1v:"陈述古任建州浦城知县，有人家失窃，抓了几个人，不知谁是真盗。述古就骗他们说：「某庙有一口钟，能辨认盗贼，特别灵验。」派人把钟迎到后阁供奉，领嫌犯们站在钟前，亲自宣布：「没偷东西的，摸钟没有声音；偷了东西的，摸钟就会响。」",
 act2:"述古自率同职祷钟甚肃。祭讫，以帷围之，乃阴使人以墨涂钟。良久，引囚逐一令引手入帷摸之，出乃验其手，皆有墨，唯有一囚无墨。讯之，遂承为盗。盖恐钟有声，不敢摸也。",
 act2v:"述古亲自领着同僚极其肃穆地祭钟。祭完，用帷帐把钟围起来，暗中让人把墨涂在钟上。过了很久，领嫌犯逐一伸手进帷帐摸钟，出来验手——都有墨，只有一个嫌犯手上无墨。审问他，果然承认是盗贼。原来他怕钟响，根本不敢摸。",
 note:"「恐钟有声，不敢摸也。」—— 钟不会说话，但做贼心虚的人会自己暴露。骗局的对面，是心理。",
 hint:"思辨：这和张举焚猪、苏无名捕盗一样吗？述古骗的是「贼的心理」。用「诈」来求「真」，边界在哪里？",
 tags:["求真","思辨","批判"]},

{id:"yuefa", dept:"上智部", level:"🌱 入门", title:"约法三章",
 act1:"汉高祖刘邦先入关中，还军霸上，召诸县父老豪杰曰：「父老苦秦苛法久矣，诽谤者族，偶语者弃市。」",
 act1v:"汉高祖刘邦先攻入关中，把军队驻在霸上，召集各县父老豪杰说：「父老乡亲们受秦朝严苛法令之苦很久了——议论朝政的要灭族，相聚说话的要处死。」",
 act2:"「吾与诸侯约，先入关者王之，吾当王关中。与父老约，法三章耳：杀人者死，伤人及盗抵罪。余悉除去秦法。」秦民大喜，争持牛羊酒食献飨军士。沛公又让不受，曰：「仓粟多，非乏，不欲费人。」人又益喜，唯恐沛公不为秦王。",
 act2v:"「我与诸侯约定，先入关中的做关中王，我应当做关中王。现在与父老约定，法律只有三条：杀人者处死，伤人及偷盗者抵罪。其余秦朝苛法全部废除。」秦地百姓大喜，争相拿着牛羊酒食献给军士。刘邦推让不接受，说：「仓库粮食多，不缺，不想破费百姓。」百姓更加高兴，唯恐刘邦不做秦王。",
 note:"「法三章耳，余悉除去秦法。」—— 秦法千千万万条，不如三条管用。规则不在多，在让人记得住、信得过。",
 hint:"思辨：班规、家规如果有一大堆，效果反而差？如果让你定「家庭三条」，会是哪三条？",
 tags:["格局","诚信"]},

{id:"zhangyi", dept:"术智部", level:"🌳 挑战", title:"张仪欺楚",
 act1:"张仪为秦说楚怀王曰：「大王诚能闭关绝齐，臣请献商於之地六百里，使秦女得为大王箕帚之妾。」楚怀王贪而信张仪，遂绝齐，群臣皆贺，陈轸独吊。",
 act1v:"张仪为秦国游说楚怀王说：「大王若能封闭关口与齐国绝交，我愿献上商於之地六百里，再让秦国女子做您的侍妾。」楚怀王贪心而轻信张仪，就与齐国绝交，群臣都来祝贺，只有陈轸表示哀吊。",
 act2:"楚使使如秦受地。张仪至秦，详失绥堕车，不朝三月。楚王乃使勇士至宋，借宋之符，北骂齐王。张仪知齐楚之交恶，乃朝，谓楚使曰：「臣有奉邑六里，愿以献大王左右。」楚使归报，怀王大怒，发兵攻秦，大败于丹阳，丧师八万，失汉中之地。",
 act2v:"楚国派使者到秦国接受土地。张仪回秦后，假装没拉住车绳从车上跌落，三个月不上朝。楚王竟派勇士到宋国借符节，北上辱骂齐王。张仪得知齐楚交恶，才上朝，对楚使说：「我有封邑六里，愿意献给大王左右。」楚使回国报告，怀王大怒，发兵攻秦，在丹阳大败，损兵八万，丢了汉中之地。",
 note:"「商於六百里」变成「奉邑六里」—— 天上掉的馅饼，多半是钓钩上的饵。怀王输在贪，也输在没人听得进陈轸的逆耳言。",
 hint:"批判讨论：张仪的骗术和王戎识李「道边多子必苦李」是同一个道理吗？「六百里换绝交」这种好事，先问哪几个问题？",
 tags:["批判","思辨","识人"]},

{id:"zhouyafu", dept:"兵智部", level:"🌿 进阶", title:"周亚夫坚壁",
 act1:"吴楚七国反，周亚夫将兵击之。亚夫言于上曰：「楚兵剽轻，难与争锋，愿以梁委之，绝其食道，乃可制也。」上许之。亚夫至荥阳，坚壁不出。吴攻梁急，梁求救，亚夫不许。",
 act1v:"吴楚七国叛乱，周亚夫率兵迎击。亚夫对皇上说：「楚兵骠悍轻捷，难与他们正面争锋，希望暂时放弃梁国，断绝叛军的粮道，才能制敌。」皇上准许。亚夫到了荥阳，坚守营垒不出战。吴军猛攻梁国，梁国求救，亚夫不救。",
 act2:"亚夫使轻骑兵弓高侯等绝吴楚兵后食道。吴兵乏粮，饥，数挑战，终不出。夜，军中惊，内相攻击扰乱，至于帐下，亚夫坚卧不起。顷之，复定。吴兵既饿，乃引而去。亚夫出精兵追击，大破之。吴王濞弃其军，亡走。凡相守三月，而吴楚破平。",
 act2v:"亚夫派弓高侯等轻骑兵截断吴楚军后方粮道。吴兵缺粮挨饿，多次挑战，亚夫始终不出。夜里，军中惊乱，士兵互相攻击，闹到亚夫帐下，亚夫照样安卧不起。不久，自行安定。吴兵饿极了，只得撤兵。亚夫派精兵追击，大破吴军。吴王刘濞丢下军队逃走。前后相持三个月，吴楚叛乱被平定。",
 note:"「坚壁不出，绝其食道。」—— 别人最想要你出手的时候，恰恰是最不该出手的时候。赢，先赢在忍得住。",
 hint:"思辨：骂战里「不接招」、游戏里「不冲动开团」，和周亚夫的坚壁是同一个道理吗？",
 tags:["沉住气","思辨","格局"]},

{id:"zouji", dept:"语智部", level:"🌿 进阶", title:"邹忌讽齐王纳谏",
 act1:"邹忌修八尺有余，而形貌昳丽。朝服衣冠，窥镜，谓其妻曰：「我孰与城北徐公美？」其妻曰：「君美甚，徐公何能及君也？」忌不自信，而复问其妾曰：「吾孰与徐公美？」妾曰：「徐公何能及君也？」旦日，客从外来，与坐谈，问之客曰：「吾与徐公孰美？」客曰：「徐公不若君之美也。」明日徐公来，孰视之，自以为不如；窥镜而自视，又弗如远甚。暮寝而思之。",
 act1v:"邹忌身高八尺多，容貌俊美。早晨穿戴衣冠，照镜子，对妻子说：「我和城北徐公谁美？」妻子说：「您美极了，徐公怎能比得上您？」邹忌不自信，又问妾：「我和徐公谁美？」妾说：「徐公怎能比得上您？」第二天，客人从外来，坐着交谈，又问客人：「我和徐公谁美？」客人说：「徐公不如您美。」次日徐公来了，邹忌仔细端详，自认为不如；再照镜子看自己，更觉得差得远。晚上躺着思考这件事。",
 act2:"曰：「吾妻之美我者，私我也；妾之美我者，畏我也；客之美我者，欲有求于我也。」于是入朝见威王，曰：「臣诚知不如徐公美。臣之妻私臣，臣之妾畏臣，臣之客欲有求于臣，皆以美于徐公。今齐地方千里，百二十城，宫妇左右莫不私王，朝廷之臣莫不畏王，四境之内莫不有求于王：由此观之，王之蔽甚矣。」王曰：「善。」乃下令：「群臣吏民能面刺寡人之过者，受上赏。」令初下，群臣进谏，门庭若市。",
 act2v:"邹忌悟道：「我妻子说我美，是偏爱我；妾说我美，是怕我；客人说我美，是有求于我。」于是入朝拜见威王，说：「我确实知道不如徐公美。我妻子偏爱我，我妾怕我，我客人有求于我，都说我比徐公美。如今齐国方圆千里，一百二十座城，宫中姬妾近臣没有不偏爱大王的，朝廷之臣没有不怕大王的，四境之内没有不有求于大王的：由此看来，大王受的蒙蔽太严重了。」威王说：「好。」于是下令：「群臣官吏百姓能当面指责我过错的，受上赏。」命令刚下，群臣进谏，宫门庭院像集市一样。",
 note:"「私我、畏我、有求于我。」—— 别人夸你之前，先想他为什么夸你。邹忌用「照镜子」悟出了听真话的难处。",
 hint:"网络与信息：网上人人都在夸某个东西时，用邹忌的三问（偏爱他？怕他？有求于他？）过滤一遍试试。",
 tags:["思辨","识人","求真"]},

{id:"mayuan", dept:"胆智部", level:"🌱 入门", title:"马援老当益壮",
 act1:"马援尝曰：「丈夫为志，穷当益坚，老当益壮。」建武二十四年，五溪蛮反，援请行。时年六十二，帝愍其老，未许之。",
 act1v:"马援曾说：「大丈夫立志，越穷困越要坚定，越年老越要雄壮。」建武二十四年，五溪蛮族反叛，马援请求出征。当时他六十二岁，光武帝怜悯他年老，没有答应。",
 act2:"援自请曰：「臣尚能被甲上马。」帝令试之。援据鞍顾眄，以示可用。帝笑曰：「矍铄哉是翁也！」遂遣援率四万余人征五溪。援常谓人曰：「男儿要当死于边野，以马革裹尸还葬耳，何能卧床上在儿女子手中邪？」",
 act2v:"马援自己请求说：「我还能披甲上马。」皇帝让他试试。马援扶鞍上马，左右顾盼，显示还可任用。皇帝笑道：「这老者真精神矍铄啊！」于是派马援率四万多人征讨五溪。马援常对人说：「男儿应当死在边疆旷野，用马皮裹着尸体回来安葬，怎能躺在床上死在儿女手中呢？」",
 note:"「穷当益坚，老当益壮。」—— 年龄和困境都不是「算了」的理由。",
 hint:"学习：「我数学就是不行」「我记性差」——马援六十二岁还上马，你的「不行」是真的不行，还是提前认了？",
 tags:["勇气","格局"]},

{id:"shuguang", dept:"明智部", level:"🌿 进阶", title:"疏广散金",
 act1:"疏广为太子太傅，兄子受为少傅。在位五岁，广谓受曰：「吾闻知足不辱，知止不殆。今宦成名立，如此不去，惧有后悔。」即日父子俱移病，乞骸骨，上许之，加赐黄金二十斤，皇太子赠以五十斤。",
 act1v:"疏广任太子太傅，侄子疏受任少傅。在职五年，疏广对疏受说：「我听说知足不受辱，知止不危险。如今官位名声都有了，这样还不离开，恐怕会后悔。」当天叔侄俩就上书称病，请求告老还乡，皇上准许，加赐黄金二十斤，皇太子又赠五十斤。",
 act2:"广既归乡里，日令家共具设酒食，请族人故旧宾客，与相娱乐。子孙劝其立田宅，广曰：「吾岂老悖不念子孙哉？顾自有旧田庐，令子孙勤力其中，足以共衣食。今复增益之以为赢余，但教子孙怠惰耳。贤而多财，则损其志；愚而多财，益增其过。」于是族人说服。",
 act2v:"疏广回乡后，每天让家里备办酒食，请族人故旧宾客一同娱乐。子孙劝他置办田宅，疏广说：「我难道老糊涂不挂念子孙吗？只是家里自有旧田宅，让子孙在其中勤力作务，足以供衣食。如今再增加产业作为盈余，只是教子孙懒惰罢了。子孙贤能而多财，会消磨他的志气；子孙愚笨而多财，更增添他的过错。」族人听后都心悦诚服。",
 note:"「贤而多财，则损其志。」—— 留给子孙最好的东西，不是钱财，是让他们自己挣的能力。",
 hint:"家庭日常：「爸妈给你准备好一切」和「留一些让你自己挣」，哪个才是真正对你好？",
 tags:["格局","识人","思辨"]},

{id:"xiedaoyun", dept:"闺智部", level:"🌱 入门", title:"咏絮之才",
 act1:"谢太傅寒雪日内集，与儿女讲论文义。俄而雪骤，公欣然曰：「白雪纷纷何所似？」兄子胡儿曰：「撒盐空中差可拟。」",
 act1v:"谢太傅（谢安）在寒冷的雪天召集家庭聚会，和小辈们谈论文章义理。不久雪下大了，谢公高兴地问：「白雪纷纷扬扬像什么？」侄儿胡儿说：「在空中撒盐，差不多可以比拟。」",
 act2:"兄女曰：「未若柳絮因风起。」公大笑乐。即公大兄无奕女，左将军王凝之妻也。后称女子之才敏者为「咏絮之才」。",
 act2v:"侄女谢道韫说：「不如比作柳絮乘风起舞。」谢公大笑赞赏。她就是谢安长兄谢无奕的女儿，左将军王凝之的妻子。后人称才华敏捷的女子为「咏絮之才」。",
 note:"「未若柳絮因风起。」—— 盐只像雪的颜色，柳絮却像雪的轻盈与春意。好的想象，要抓住神，不只是形。",
 hint:"学习：写比喻句时，「撒盐」和「柳絮」差在哪里？下次作文试着找「神似」而不只是「形似」。",
 tags:["智慧","思辨"]},

{id:"sangumao", dept:"上智部", level:"🌱 入门", title:"三顾茅庐",
 act1:"时先主屯新野。徐庶见先主，先主器之，谓先主曰：「诸葛孔明者，卧龙也，将军岂愿见之乎？」先主曰：「君与俱来。」庶曰：「此人可就见，不可屈致也。将军宜枉驾顾之。」",
 act1v:"当时刘备驻守新野。徐庶拜见刘备，刘备很器重他。徐庶对刘备说：「诸葛孔明是卧龙，将军愿意见他吗？」刘备说：「你和他一起来吧。」徐庶说：「这个人只能到他那里去拜见，不能委屈他召来。将军应当屈尊去拜访他。」",
 act2:"由是先主遂诣亮，凡三往，乃见。亮时年二十七，为陈天下三分之计。先主曰：「孤之有孔明，犹鱼之有水也。」",
 act2v:"于是刘备就去拜访诸葛亮，总共去了三次，才见到。诸葛亮当时二十七岁，为刘备陈述了三分天下的计策。刘备说：「我有了孔明，就像鱼有了水啊。」",
 note:"「凡三往，乃见。」—— 大人物三顾茅庐，请的不是人，是「诚意」两个字。真正想要一样东西，就值得为它多跑几趟。",
 hint:"校园生活：想请高手教你打球、教你解题，「发一句消息」和「诚心诚意多跑几趟」，结果会一样吗？",
 tags:["诚信","格局"]},

{id:"mianchi", dept:"胆智部", level:"🌿 进阶", title:"渑池之会",
 act1:"秦王使使者告赵王，欲与王为好会于渑池。赵王畏秦，欲毋行。廉颇、蔺相如计曰：「王不行，示赵弱且怯也。」赵王遂行，相如从。秦王饮酒酣，曰：「寡人窃闻赵王好音，请奏瑟。」赵王鼓瑟。秦御史前书曰「某年月日，秦王与赵王会饮，令赵王鼓瑟」。",
 act1v:"秦王派使者告诉赵王，想在渑池与赵王举行友好会面。赵王怕秦国，不想去。廉颇、蔺相如商议说：「大王不去，就显得赵国软弱胆怯。」赵王于是成行，蔺相如随从。秦王喝酒喝到酣畅，说：「我私下听说赵王爱好音乐，请弹瑟。」赵王弹了瑟。秦国御史上前记录：「某年某月某日，秦王与赵王会饮，令赵王弹瑟。」",
 act2:"蔺相如前曰：「赵王窃闻秦王善为秦声，请奏盆缻秦王，以相娱乐。」秦王怒，不许。于是相如前进缻，因跪请秦王。秦王不肯击缻。相如曰：「五步之内，相如请得以颈血溅大王矣！」左右欲刃相如，相如张目叱之，左右皆靡。于是秦王不怿，为一击缻。相如顾召赵御史书曰「某年月日，秦王为赵王击缻」。",
 act2v:"蔺相如上前说：「赵王私下听说秦王擅长秦地音乐，请秦王击盆缻，以相娱乐。」秦王发怒，不答应。于是相如进献盆缻，跪下请秦王。秦王不肯击。相如说：「五步之内，请让我以颈血溅大王！」秦王左右要杀相如，相如瞪眼呵斥他们，左右都退避了。秦王这才不高兴地击了一下缻。相如回头叫赵国御史记录：「某年某月某日，秦王为赵王击缻。」",
 note:"「五步之内，请以颈血溅大王。」—— 国与国争的是面子，背后是命。蔺相如敢拼命，是因为退半步，赵国就矮一截。",
 hint:"思辨：为什么一个「击缻」的小动作值得拼命？有些「小事」不能让步，怎么分辨哪些是让不得的？",
 tags:["勇气","格局"]},

{id:"qutu", dept:"明智部", level:"🌱 入门", title:"曲突徙薪",
 act1:"客有过主人者，见其灶直突，傍有积薪，客谓主人：「更为曲突，远徙其薪，不者且有火患。」主人嘿然不应。",
 act1v:"有位客人拜访主人，看见他家灶的烟囱是直的，旁边堆着柴草，客人对主人说：「把烟囱改成弯曲的，把柴草搬远些，不然会有火灾。」主人默然不答理。",
 act2:"俄而家果失火，邻里共救之，幸而得息。于是杀牛置酒，谢其邻人，灼烂者在于上行，余各以功次坐，而不录言曲突者。人谓主人曰：「乡使听客之言，不费牛酒，终亡火患。今论功而请宾，曲突徙薪亡恩泽，焦头烂额为上客耶？」主人乃寤而请之。",
 act2v:"不久，这家果然失火，邻里都来扑救，幸好火灭了。于是主人杀牛摆酒，感谢邻居，烧得焦头烂额的坐在上座，其余按功劳排座，却不请当初建议「曲突徙薪」的客人。有人对主人说：「当初要是听了那位客人的话，不用破费牛酒，也不会有火灾。如今论功请客，建议曲突徙薪的没有恩惠，焦头烂额的反成了上宾吗？」主人这才醒悟，去请了那位客人。",
 note:"「曲突徙薪无恩泽，焦头烂额为上客。」—— 提前防患的人看不见功劳，救火的英雄人人称颂。可真正的智慧，是让火灾根本不发生。",
 hint:"思辨：提前写完作业和最后一天熬夜补完，哪个更像「焦头烂额」？为什么「没出事的人」常常得不到感谢？",
 tags:["思辨","格局"]},

{id:"huaibing", dept:"捷智部", level:"🌱 入门", title:"怀丙捞铁牛",
 act1:"宋河中府浮梁，用铁牛八维之，一牛且数万斤。后水暴涨绝梁，牵牛没于河，募能出之者。",
 act1v:"宋朝时河中府有座浮桥，用八尊铁牛拴系，一尊铁牛重达数万斤。后来河水暴涨冲断浮桥，铁牛被牵入河中沉没，官府招募能把铁牛捞上来的人。",
 act2:"真定僧怀丙以二大舟实土，夹牛维之，用大木为权衡状，钩牛，徐去其土，舟浮牛出。转运使张焘以闻，赐之紫衣。",
 act2v:"真定和尚怀丙用两条大船装满土，把铁牛夹在两船之间系牢，用大木头做成秤杆的形状，钩住铁牛，慢慢卸去船上的土，船浮起，铁牛就被拔出来了。转运使张焘上报朝廷，赐他紫衣。",
 note:"「徐去其土，舟浮牛出。」—— 不用起重机，让水的浮力替你干活。",
 hint:"学习：怀丙借助的是浮力。解数学题时，「借助一个已知的东西」和「硬算」有什么区别？",
 tags:["智慧","思辨"]},

{id:"beijiu", dept:"术智部", level:"🌿 进阶", title:"杯酒释兵权",
 act1:"宋太祖因石守信等掌禁军日久，一日召守信等饮，酒酣，屏左右谓曰：「我非尔曹之力，不得至此，念尔曹之德，无有穷尽。然天子亦大艰难，殊不若为节度使之乐，吾终夕未尝敢安枕而卧也。」守信等请其故，帝曰：「是不难知，居此位者，谁不欲为之！」守信等顿首涕泣曰：「陛下何为出此言？」",
 act1v:"宋太祖因石守信等人掌管禁军日久，一天召石守信等人饮酒，酒酣时屏退左右说：「我不是靠你们的力量，到不了今天，感念你们的恩德，没有穷尽。但做天子也太艰难，远不如做节度使快乐，我整夜都不敢安枕而卧。」石守信等请问缘故，皇帝说：「这不难知道，坐在这个位子上，谁不想做呢！」石守信等叩头流泪说：「陛下为什么说这话？」",
 act2:"帝曰：「卿等固然，设麾下有欲富贵者，一旦以黄袍加汝身，汝虽欲不为，其可得乎？人生如白驹过隙，所为贵富贵者，不过欲多积金钱，厚自娱乐，使子孙无贫乏耳。卿等何不释去兵权，出守大藩，择便好田宅市之，为子孙立永远之业，日饮酒相欢以终其天年？」守信等皆谢曰：「陛下念臣至此，所谓生死而肉骨也。」明日，皆称疾请罢。帝从之，赏赉甚厚。",
 act2v:"皇帝说：「你们固然没有异心，假使部下有人贪图富贵，一旦把黄袍披在你身上，你即使不想干，能行吗？人生如白驹过隙，追求富贵，不过是想多积金钱，好好娱乐，让子孙不受贫困罢了。你们何不交出兵权，出守大镇，选好田宅买下来，为子孙立永久的家业，天天饮酒作乐以终天年？」石守信等都拜谢说：「陛下为我们考虑到这一步，真是让死者复生、白骨生肉啊。」第二天，都称病请求解除兵权。皇帝准许，赏赐极厚。",
 note:"「人生如白驹过隙。」—— 不流血、不翻脸，一顿酒就解掉了最大的隐患。代价是钱，换来的是安。",
 hint:"思辨：宋太祖可以用「杀人」解决，却用了「给好处」。解决冲突时，「让对方自愿放下」比「强迫」高明在哪？",
 tags:["智慧","格局","思辨"]},

{id:"xunguan", dept:"闺智部", level:"🌿 进阶", title:"荀灌突围请救",
 act1:"荀崧为襄城太守，为杜曾所围，力弱食尽，欲求救于故吏平南将军石览，计无从出。崧小女灌，年十三。",
 act1v:"荀崧任襄城太守，被杜曾围困，兵力薄弱、粮草将尽，想向旧部平南将军石览求救，却想不出办法出城。荀崧的小女儿荀灌，这年十三岁。",
 act2:"灌乃率勇士数十人，逾城突围夜出。贼追甚急，灌督厉将士，且战且前，得入鲁阳山获免。自诣览乞师，又为崧书与南中郎将周访请援，仍结为兄弟，访即遣子抚率三千人会石览俱救崧。贼闻兵至，散走，灌之力也。",
 act2v:"荀灌便率领几十名勇士，夜里越城突围而出。贼兵追得很急，荀灌督促激励将士，边战边进，进入鲁阳山得以脱险。她亲自到石览处请求援兵，又替荀崧写信给南中郎将周访求援，并代父与周访结为兄弟，周访立即派儿子周抚率三千人会合石览一同救荀崧。贼兵听说援军到了，四散逃走——这全是荀灌的功劳。",
 note:"「年十三，夜缒突围。」—— 十三岁的女孩，替全城杀出一条求援的路。年纪从来不是「我不能」的理由。",
 hint:"勇气：荀灌和缇萦，一个用兵、一个用笔。女孩子在两千年前的勇气，和今天的勇气有什么相同？",
 tags:["勇气","智慧"]},

{id:"lisu", dept:"兵智部", level:"🌿 进阶", title:"李愬雪夜袭蔡州",
 act1:"李愬谋袭蔡州，以李祐为将，训兵马。时大风雪，旌旗裂，人马冻死者相望。天阴黑，自张柴村以东道路皆官军所未尝行，人人自以为必死，然畏愬，莫敢违。",
 act1v:"李愬谋划奇袭蔡州，用李祐为将，训练兵马。当时刮大风下大雪，军旗都被吹裂，冻死的人马相望于道。天色昏黑，从张柴村往东的道路都是官军从未走过的，人人都以为必死，但畏惧李愬，没人敢违抗。",
 act2:"夜半，雪愈甚，行七十里，至州城。近城有鹅鸭池，愬令惊之以混军声。四鼓，愬至城下，无一人知者。李祐、李忠义镢其城为坎以先登，壮士从之。守门卒方熟寐，尽杀之，而留击柝者，使击柝如故。遂开门纳众。及里城，亦然，城中皆不之觉。鸡鸣，雪止，愬入居元济外宅。元济尚寝，笑曰：「俘囚为盗耳！晓当尽戮之。」及闻愬军号令，始大惊，遂成擒。",
 act2v:"半夜，雪更大了，行军七十里，到了蔡州城。城边有鹅鸭池，李愬命惊动鹅鸭，用叫声掩盖行军声。四更天，李愬到城下，无一人发觉。李祐、李忠义在城墙上挖坎先登，壮士跟上。守门士兵正熟睡，全部被杀，只留下打更的，让他照常打更。于是打开城门放大军进去。到了内城，也照样，城中都没察觉。鸡叫，雪停，李愬进驻吴元济的外宅。元济还在睡觉，笑道：「俘虏偷东西罢了！天亮把他们都杀了。」等听到李愬军队的号令，才大惊，终被擒获。",
 note:"「惊鹅鸭以混军声。」—— 最恶劣的天气，是最好的掩护。人人都「不敢走」的路，才是最不设防的路。",
 hint:"思辨：雪夜进军，所有人都觉得「必死」，李愬为什么敢？「险」和「巧」怎么区分？",
 tags:["勇气","智慧","思辨"]},

{id:"huashe", dept:"语智部", level:"🌱 入门", title:"画蛇添足",
 act1:"楚有祠者，赐其舍人卮酒。舍人相谓曰：「数人饮之不足，一人饮之有余。请画地为蛇，先成者饮酒。」",
 act1v:"楚国有个祭祀的人，赏给门客们一壶酒。门客们商量说：「几个人喝不够，一个人喝有余。请大家在地上画蛇，先画成的喝酒。」",
 act2:"一人蛇先成，引酒且饮之，乃左手持卮，右手画蛇曰：「吾能为之足。」未成，一人之蛇成，夺其卮曰：「蛇固无足，子安能为之足？」遂饮其酒。为蛇足者，终亡其酒。",
 act2v:"一人先把蛇画成了，拿起酒将要喝，于是左手持壶，右手画蛇说：「我能给它添上脚。」还没画完，另一人的蛇画成了，夺过他的酒壶说：「蛇本来没有脚，你怎么能给它添脚？」就喝了那酒。给蛇添脚的人，最终失掉了那壶酒。",
 note:"「蛇固无足，子安能为之足？」—— 做成了的事，多此一举反而坏事。知道「够了」，和知道「怎么赢」一样重要。",
 hint:"学习：作文结尾明明很好，又加一段「升华」反而画蛇添足——你有过这种「多此一举」吗？",
 tags:["思辨","智慧"]},

{id:"zhaojun", dept:"杂智部", level:"🌳 挑战", title:"昭君与画工",
 act1:"汉元帝后宫既多，不得常见，乃使画工图形，案图召幸之。诸宫人皆赂画工，多者十万，少者亦不减五万。独王嫱不肯，遂不得见。",
 act1v:"汉元帝后宫人多，不能常见，就让画工画像，按图召幸。宫女们都贿赂画工，多的十万钱，少的也不下五万。只有王昭君不肯行贿，于是始终不得召见。",
 act2:"匈奴入朝，求美人为阏氏。于是上案图，以昭君行。及去，召见，貌为后宫第一，善应付，举止闲雅。帝悔之，而名籍已定，重信于外国，故不复更人。乃穷案其事，画工毛延寿等皆弃市。",
 act2v:"匈奴来朝，求美女为阏氏。于是元帝按图，派昭君前往。临行召见，容貌为后宫第一，善于应对，举止娴雅。元帝后悔了，但名册已定，又需对外国守信，所以不再换人。于是彻查此事，画工毛延寿等都被处死。",
 note:"「诸宫人皆赂画工，独王嫱不肯。」—— 读这一则要两面看：昭君不贿赂，守住了自己；元帝凭画像选人，丢了真人。欺人的画工死了，可信「图」不信「人」的错，谁来担？",
 hint:"批判讨论：「按图选人」像不像今天「只看照片/简历/分数」？昭君不肯行贿是对的吗——如果「大家都这么做」，不跟的人吃亏吗？",
 tags:["批判","诚信","思辨"]},

{id:"yuzhongwen", dept:"察智部", level:"🌿 进阶", title:"于仲文伤牛",
 act1:"于仲文为安固太守。有任、杜两家各失牛，后得一牛，两家俱认，州郡久不能决。益州长史韩伯俊曰：「于安固少聪察，可令决之。」仲文对曰：「此易解耳。」",
 act1v:"于仲文任安固太守。有任、杜两家各丢了一头牛，后来找到一头牛，两家都来认领，州郡长久不能决断。益州长史韩伯俊说：「于仲文从小聪明善察，可让他来断。」仲文答：「这容易解决。」",
 act2:"于是令驱牛各至其家，牛群放之，认所驱牛，识其本群。又密使人微伤其牛，任氏嗟惋，杜家自若。仲文于是诃诘杜氏，杜氏服罪而去。",
 act2v:"于是让人把牛赶到各家的牛群中放开——牛自己走进了任家的牛群。又暗中让人轻轻弄伤那头牛，任家人见了嗟叹惋惜，杜家人若无其事。于仲文于是呵斥追问杜家，杜家认罪离去。",
 note:"「任氏嗟惋，杜家自若。」—— 牛认群，人认情。真的主人心疼，假的主人无所谓。",
 hint:"思辨：这则和「李崇断子」用了同一个办法——观察「谁心疼」。怎么区分真关心和装关心？",
 tags:["识人","求真"]},

{id:"caocan", dept:"上智部", level:"🌿 进阶", title:"萧规曹随",
 act1:"曹参代萧何为汉相国，举事无所变更，一遵萧何之约束。择郡国吏木诎于文辞、重厚长者，即召除为丞相史。日夜饮醇酒。卿大夫已下吏及宾客见参不事事，来者皆欲有言。至者，参辄饮以醇酒，间之，欲有所言，复饮之，醉而后去，终莫得开说，以为常。",
 act1v:"曹参接替萧何做汉朝相国，办事无所变更，一切遵守萧何的旧规。选择郡国官吏中不善文辞、忠厚持重的人，召来任丞相属官。日夜饮醇酒。卿大夫以下的官吏和宾客见曹参不理事，来的人都想进言。来的人一到，曹参就用醇酒招待，稍有空隙，刚要说话，又劝酒，喝醉而后离去，始终没能开口，习以为常。",
 act2:"惠帝怪相国不治事，使曹窋问之。参怒，笞窋二百。上乃让参，参免冠谢曰：「陛下自察圣武孰与高帝？」上曰：「朕乃安敢望先帝乎！」曰：「陛下观臣能孰与萧何贤？」上曰：「君似不及也。」参曰：「陛下言之是也。且高帝与萧何定天下，法令既明，今陛下垂拱，参等守职，遵而勿失，不亦可乎？」惠帝曰：「善。君休矣！」百姓歌之曰：「萧何为法，顜若画一；曹参代之，守而勿失。」",
 act2v:"惠帝怪相国不理政事，让曹参的儿子曹窋去问他。曹参发怒，打了曹窋二百板。皇上责备曹参，曹参脱帽谢罪说：「陛下自己估量，圣明英武比高帝如何？」皇上说：「朕怎敢望先帝！」曹参说：「陛下看臣的才能比萧何如何？」皇上说：「您似乎不如他。」曹参说：「陛下说得对。况且高帝与萧何平定天下，法令已经明确，如今陛下垂拱而治，曹参等恪守职位，遵循旧法不失，不也可以吗？」惠帝说：「好。您休息吧！」百姓歌唱道：「萧何定法，明白划一；曹参接任，守而不失。」",
 note:"「守而勿失。」—— 不折腾，也是一种大本事。前任的办法好好的，非要「改一改证明自己」，才最误事。",
 hint:"思辨：新班长上任就推翻旧班规，一定好吗？什么时候该「萧规曹随」，什么时候该「破旧立新」？",
 tags:["格局","沉住气"]},

{id:"zhangliao", dept:"胆智部", level:"🌿 进阶", title:"张辽威震逍遥津",
 act1:"建安二十年，孙权率十万众围合肥。张辽、李典、乐进将七千余人屯合肥。辽夜募敢从之士，得八百人，椎牛飨将士，明日大战。",
 act1v:"建安二十年，孙权率十万大军围攻合肥。张辽、李典、乐进率七千多人驻守合肥。张辽连夜招募敢死之士，得八百人，杀牛犒劳将士，准备第二天大战。",
 act2:"平旦，辽被甲持戟，先登陷陈，杀数十人，斩二将，大呼自名，冲垒入，至权麾下。权大惊，众不知所为，走登高冢，以长戟自守。辽叱权下战，权不敢动。辽麾下骑叱喝，权人马皆披靡。权守合肥十余日，城不可拔，乃引退。辽率诸军追击，几复获权。太祖大壮辽。",
 act2v:"清晨，张辽披甲持戟，率先冲入敌阵，杀数十人，斩两员大将，大呼自己的名字，冲破营垒，直到孙权旗下。孙权大惊，众人不知所措，逃上高土堆，用长戟自卫。张辽喝令孙权下来交战，孙权不敢动。张辽部下骑兵呐喊冲杀，孙权人马纷纷溃退。孙权围攻合肥十多天，攻不下来，就撤退了。张辽率各军追击，差点又捉住孙权。曹操大赞张辽。",
 note:"「八百人陷十万众。」—— 兵力十倍于我又如何，张辽赌的是「先声夺人」：气势垮了，人数只是数字。",
 hint:"思辨：张辽八百人冲十万人，是匹夫之勇吗？他赢在哪一步——「敢」还是「算」？",
 tags:["勇气","思辨"]},

{id:"bianque", dept:"明智部", level:"🌿 进阶", title:"扁鹊三兄弟",
 act1:"魏文侯问扁鹊曰：「子昆弟三人，其孰最善为医？」扁鹊曰：「长兄最善，中兄次之，扁鹊最为下。」文侯曰：「可得闻邪？」",
 act1v:"魏文侯问扁鹊：「你们兄弟三人，谁最擅长医术？」扁鹊说：「长兄最擅长，中兄其次，我最差。」文侯说：「可以说来听听吗？」",
 act2:"扁鹊曰：「长兄于病视神，未有形而除之，故名不出于家。中兄治病，其在毫毛，故名不出于闾。若扁鹊者，镵血脉，投毒药，副肌肤间，而名出闻于诸侯。」文侯曰：「善。」",
 act2v:"扁鹊说：「长兄看病看的是神气，病还没有成形就除掉了，所以名声不出家门。中兄治病，治在毛发初起的阶段，所以名声不出街巷。像我扁鹊，针刺血脉、投放毒药、割开肌肤，所以名声传到了诸侯那里。」文侯说：「说得好。」",
 note:"「未有形而除之。」—— 名气最大的，是把小病拖成大病再治的；最高明的，是让病根本不发生。",
 hint:"思辨：扁鹊长兄和「曲突徙薪」是不是同一个道理？为什么「预防」总是得不到掌声？",
 tags:["思辨","格局"]},

{id:"wentai", dept:"上智部", level:"🌱 入门", title:"汉文帝惜露台",
 act1:"汉文帝尝欲作露台，召匠计之，直百金。",
 act1v:"汉文帝曾想造一座露台，召工匠来计算，需要一百金。",
 act2:"上曰：「百金，中人十家之产也。吾奉先帝宫室，常恐羞之，何以台为！」身衣弋绨，所幸慎夫人衣不曳地，帷帐无文绣，以示敦朴，为天下先。",
 act2v:"文帝说：「一百金，是十户中等人家的财产。我住着先帝的宫室，常常怕辱没它，还造什么露台呢！」文帝自己穿黑色粗丝衣服，宠爱的慎夫人衣裙不拖到地上，帷帐不用文绣，以此表示敦厚朴素，做天下的表率。",
 note:"「百金，中人十家之产也。」—— 想要之前先算算「这值多少家人的一年」。克制不是穷，是心里有别人。",
 hint:"家庭日常：买一件贵东西前，文帝会怎么想？「想要」和「值得」怎么算这笔账？",
 tags:["格局","思辨"]},

{id:"shuiyan", dept:"兵智部", level:"🌿 进阶", title:"水淹七军",
 act1:"关羽攻樊城，魏将于禁督七军救之。秋，大霖雨，汉水溢，平地水数丈。",
 act1v:"关羽进攻樊城，魏将于禁率七军救援。秋天，大雨连绵，汉水暴涨，平地水深数丈。",
 act2:"禁与诸将登高避水，羽乘大船就攻之，禁等穷迫，遂降。羽又斩将军庞德。威震华夏，曹公议徙许都以避其锐。",
 act2v:"于禁与诸将登上高处避水，关羽乘大船进逼攻击，于禁等走投无路，于是投降。关羽又斩杀将军庞德。威震华夏，曹操甚至商议迁离许都以避其锋芒。",
 note:"「大霖雨，汉水溢。」—— 关羽赢的不只是水军，是他懂天时地势，而于禁把大军扎在了低洼处。",
 hint:"思辨：同样的暴雨，关羽是天助，于禁是灭顶——区别在哪？「看环境」在做事前有多重要？",
 tags:["智慧","思辨"]},

{id:"caiwenji", dept:"闺智部", level:"🌱 入门", title:"文姬辨弦",
 act1:"蔡琰，字文姬，邕之女也。邕夜鼓琴，弦绝。琰曰：「第二弦。」邕曰：「偶得之耳。」",
 act1v:"蔡琰，字文姬，是蔡邕的女儿。蔡邕夜里弹琴，一根弦断了。蔡琰说：「第二弦。」蔡邕说：「碰巧猜中罢了。」",
 act2:"故断一弦问之，琰曰：「第四弦。」并不差谬。邕由是奇之。",
 act2v:"蔡邕故意又弄断一根弦问她，蔡琰说：「第四弦。」一点也不差。蔡邕从此对她另眼相看。",
 note:"「故断一弦问之，并不差谬。」—— 第一次可以是运气，第二次就是真功夫。别人怀疑你时，用第二次证明给他看。",
 hint:"学习：别人说你「只是运气好/只是蒙的」，最好的回应是辩解，还是再来一次？",
 tags:["智慧","求真"]},

{id:"xuruzi", dept:"捷智部", level:"🌱 入门", title:"徐孺子赏月",
 act1:"徐孺子年九岁，尝月下戏，人语之曰：「若令月中无物，当极明邪？」",
 act1v:"徐孺子九岁时，曾在月下玩耍，有人对他说：「如果让月亮里什么都没有，会不会更明亮呢？」",
 act2:"徐曰：「不然。譬如人眼中有瞳子，无此必不明。」",
 act2v:"徐孺子说：「不对。好比人眼睛里有瞳仁，没有它必定看不见。」",
 note:"「譬如人眼中有瞳子。」—— 九岁的孩子，用一个「比方」回答了一个难题。讲不清道理时，找个身边的东西来比。",
 hint:"学习：遇到抽象的问题，徐孺子的「打比方」法怎么用在你的表达里？",
 tags:["智慧","思辨"]},

{id:"fanhuang", dept:"术智部", level:"🌿 进阶", title:"范仲淹荒政",
 act1:"皇祐二年，吴中大饥，殍殣枕路。是时范文正领浙西，发粟及募民存饷，为术甚备。吴人喜竞渡，好为佛事。",
 act1v:"皇祐二年，吴中大饥荒，饿死的人堆积在路上。这时范仲淹主管浙西，发放粮米、招募灾民服役备粮，办法很周全。吴地百姓喜欢赛龙舟，爱做佛事。",
 act2:"希文乃纵民竞渡，太守日出宴于湖上，自春至夏，居民空巷出游。又召诸佛寺主首，谕之曰：「饥岁工价至贱，可以大兴土木之役。」于是诸寺工作鼎兴。又新敖仓吏舍，日役千夫。监司奏劾杭州不恤荒政，嬉游不节，及公私兴造，伤耗民力。文正乃自条叙所以宴游及兴造，皆欲以发有余之财，以惠贫者。贸易饮食、工技服力之人，仰食于公私者，日无虑数万人。荒政之施，莫此为大。是岁，两浙唯杭州晏然，民不流徙。",
 act2v:"范仲淹于是放开让百姓赛龙舟，太守每天到湖上宴饮，从春到夏，居民空巷出游。又召集各佛寺住持，劝谕说：「荒年工价最便宜，正可大兴土木。」于是各寺庙工程勃兴。又翻修粮仓官舍，每天用工上千。监察官弹劾杭州不救荒、嬉游无度，以及公私兴建，损耗民力。范仲淹便自己逐条说明：宴游和兴建，都是想拿出有余的钱财来救济贫人。做买卖的、卖饮食的、出工出力的，靠官府和富人吃饭的，每天不下几万人。救荒的举措，没有比这更大的了。这一年，两浙只有杭州安然无事，百姓没有流亡。",
 note:"「发有余之财，以惠贫者。」—— 灾年不紧缩反而「花钱办事」，范仲淹懂的是：让钱流动起来，穷人就有活路。",
 hint:"思辨：灾荒年办龙舟赛，听起来荒唐，为什么反而是最好的救荒？「直接发钱」和「创造工作机会」哪个更长久？",
 tags:["智慧","格局","思辨"]},

{id:"youmengma", dept:"语智部", level:"🌿 进阶", title:"优孟谏葬马",
 act1:"楚庄王有所爱马，衣以文绣，置之华屋之下，席以露床，啖以枣脯。马病肥死，使群臣丧之，欲以棺椁大夫礼葬之。左右争之，以为不可。王下令曰：「有敢以马谏者，罪至死。」优孟闻之，入殿门，仰天大哭。",
 act1v:"楚庄王有匹爱马，给它穿锦绣衣服，住华美的屋子，睡露床，吃枣脯。马得肥胖病死了，庄王让群臣为马服丧，要用棺椁以大夫之礼下葬。左右劝谏，认为不可。庄王下令说：「有敢以葬马之事劝谏的，处死罪。」优孟听说后，走进殿门，仰天大哭。",
 act2:"王惊而问其故。优孟曰：「马者王之所爱也，以楚国堂堂之大，何求不得，而以大夫礼葬之，薄，请以人君礼葬之。」王曰：「何如？」对曰：「臣请以雕玉为棺，文梓为椁，楩枫豫章为题凑，发甲卒为穿圹，老弱负土，齐赵陪位于前，韩魏翼卫其后，庙食太牢，奉以万户之邑。诸侯闻之，皆知大王贱人而贵马也。」王曰：「寡人之过一至此乎！为之奈何？」优孟曰：「请为大王六畜葬之。」于是王乃使以马属太官，无令天下久闻也。",
 act2v:"庄王惊问缘故。优孟说：「马是大王的爱物，凭楚国的堂堂大国，有什么办不到？却用大夫之礼葬它，太薄了，请用人君之礼葬它。」庄王问：「怎样？」优孟答：「我请求用雕玉做棺，文梓做椁，楩枫豫章做外椁，派甲士挖圹，老弱背土，齐赵陪祭在前，韩魏护卫在后，用太牢祭祀，封万户之邑供奉。诸侯听说了，都知道大王贱人而贵马。」庄王说：「我的过错竟到这种地步吗！怎么办？」优孟说：「请大王按六畜的规矩葬它。」于是庄王就把马交给太官处理，不让天下人长久议论。",
 note:"「请以人君礼葬之。」—— 顺着昏招推到极荒唐处，让王自己看见自己有多可笑。",
 hint:"思辨：优孟和优旃谏漆城用的是同一个办法吗？「顺着说」比「反对」多走了哪一步？",
 tags:["智慧","应变"]},

{id:"wenhou", dept:"明智部", level:"🌱 入门", title:"魏文侯期猎",
 act1:"魏文侯与虞人期猎。是日，饮酒乐，天雨。文侯将出，左右曰：「今日饮酒乐，天又雨，公将焉之？」",
 act1v:"魏文侯和掌管山林的虞人约好去打猎。这天，饮酒作乐正酣，天又下雨。文侯要动身赴约，左右说：「今天饮酒这么快乐，天又下雨，您要去哪里？」",
 act2:"文侯曰：「吾与虞人期猎，虽乐，岂可不一会期哉！」乃往，身自罢之。魏于是乎始强。",
 act2v:"文侯说：「我与虞人约好了打猎，虽然饮酒快乐，怎能不去赴约呢！」于是前往，亲自告诉虞人取消狩猎。魏国从此开始强盛。",
 note:"「虽乐，岂可不一会期哉！」—— 对方是个小人物，天又在下雨，可约定了就是约定了。守信，不看对方是谁。",
 hint:"家庭日常：和同学约好的一件小事，下雨了、累了，你会去吗？魏文侯为什么要「亲自去取消」而不是带个话？",
 tags:["诚信","格局"]},

{id:"jiming", dept:"术智部", level:"🌿 进阶", title:"鸡鸣狗盗",
 act1:"孟尝君入秦，秦昭王囚孟尝君，谋欲杀之。孟尝君使人抵昭王幸姬求解。幸姬曰：「妾愿得君狐白裘。」孟尝君有一狐白裘，直千金，天下无双，入秦献之昭王，更无他裘。",
 act1v:"孟尝君到秦国，秦昭王囚禁了他，想要杀他。孟尝君派人到昭王宠姬处求情。宠姬说：「我想要孟尝君的狐白裘。」孟尝君有一件狐白裘，价值千金，天下无双，到秦国时已献给昭王，再没有第二件。",
 act2:"孟尝君患之，遍问客，莫能对。最下坐有能为狗盗者，曰：「臣能得狐白裘。」乃夜为狗，以入秦宫臧中，取所献狐白裘至，以献秦王幸姬。幸姬为言昭王，昭王释孟尝君。孟尝君得出，即驰去，夜半至函谷关。关法鸡鸣而出客，孟尝君恐追至，客之居下坐者有能为鸡鸣，而鸡尽鸣，遂发传出。出如食顷，秦追果至关，已后孟尝君出，乃还。",
 act2v:"孟尝君发愁，遍问门客，没人有办法。最末座有个会学狗叫偷盗的，说：「我能得到狐白裘。」于是夜里装狗潜入秦宫仓库，取回献给昭王的狐白裘，献给宠姬。宠姬替孟尝君向昭王说情，昭王释放了孟尝君。孟尝君脱身立即驰逃，半夜到函谷关。关法规定鸡叫才放客出关，孟尝君怕追兵赶到，门客末座有个会学鸡叫的，他一叫，群鸡都跟着叫，于是开关放人。出关约一顿饭的工夫，秦追兵果然到关，孟尝君已出关，追兵只好回去。",
 note:"「鸡鸣狗盗，皆有所用。」—— 平时看不上眼的「小本事」，生死关头救了命。别轻视任何一项技能、任何一个人。",
 hint:"校园生活：班里「不起眼」的同学，有没有可能在某个时刻成为关键？怎么看待「小本事」？",
 tags:["识人","格局"]},

{id:"jiadao", dept:"杂智部", level:"🌿 进阶", title:"假道伐虢",
 act1:"晋献公欲伐虢，荀息曰：「请以屈产之乘与垂棘之璧，假道于虞以伐虢。」公曰：「是吾宝也。」对曰：「若得道于虞，犹外府也。」公乃使荀息假道于虞。宫之奇谏。",
 act1v:"晋献公想攻打虢国，荀息说：「请用屈地的良马和垂棘的美玉，向虞国借道来伐虢。」献公说：「这是我的宝物啊。」荀息答：「若能借道于虞，宝物不过是存放在外库罢了。」献公便派荀息向虞国借道。虞国大夫宫之奇劝谏虞公。",
 act2:"宫之奇谏曰：「虞之与虢，唇之与齿，唇亡则齿寒。」虞公不听，遂假道。晋灭虢，还，袭虞，灭之，执虞公。荀息牵马操璧而前曰：「璧则犹是也，而马齿加长矣。」",
 act2v:"宫之奇劝谏说：「虞国和虢国，就像嘴唇和牙齿，唇亡则齿寒。」虞公不听，还是借了道。晋军灭虢后回师，顺路袭击虞国，灭了它，俘虏了虞公。荀息牵着马、捧着玉璧上前说：「璧还是这块璧，只是马的牙齿长长了。」",
 note:"「唇亡则齿寒。」—— 虞公贪了一匹马一块璧，丢了一个国家。邻居倒霉时别幸灾乐祸，下一个可能就是你。",
 hint:"思辨：朋友被欺负时你在旁边看热闹，「唇亡齿寒」告诉你这为什么危险？",
 tags:["思辨","格局"]},

{id:"zhangchang", dept:"察智部", level:"🌿 进阶", title:"张敞赭衣记",
 act1:"张敞守京兆尹，长安市偷盗多，百贾苦之。敞既视事，求问长安父老，偷盗酋长数人，居皆温厚，出从童骑，闾里以为长者。敞皆召见责问，因贳其罪，把其宿负，令致诸偷以自赎。",
 act1v:"张敞任京兆尹，长安集市偷盗多，众商户深以为苦。张敞上任后，查问长安父老，得知几个盗贼头目，平日居所富足温厚，出行有童仆骑从，乡里都以为他们是忠厚长者。张敞把他们都召来责问，赦免他们的罪，抓住他们的旧案为把柄，让他们交出群偷来赎罪。",
 act2:"偷长曰：「今一旦召诣府，恐诸偷惊骇，愿壹切受署。」敞皆以为吏，遣归休。置酒，小偷悉来贺，且饮醉，偷长以赭污其衣裾。吏坐里闾阅出者，污赭辄收缚之，一日捕得数百人。穷治所犯，由是枹鼓稀鸣，市无偷盗。",
 act2v:"盗首说：「如今突然召他们到府，恐怕群偷惊骇，请把我们任命为吏。」张敞都任他们为吏，遣回家休假。盗首置酒，小偷们都来祝贺，喝醉时，盗首用赭红色染污了他们的衣襟。官吏坐在里巷口查看出来的人，衣襟有赭色就收绑，一天捕得数百人。彻底追查所犯罪行，从此报警的鼓声稀少，市上再无偷盗。",
 note:"「以赭污其衣裾。」—— 让小偷自己走进「庆功宴」，再把记号做在他们身上。对付一窝的问题，先找到它的「头目」。",
 hint:"思辨：张敞没有满街抓小偷，而是先找「偷长」。解决一团乱麻的问题，为什么要先找「线头」？",
 tags:["智慧","求真"]},

{id:"youzhanyou", dept:"语智部", level:"🌱 入门", title:"优旃谏苑囿",
 act1:"秦始皇尝议欲大苑囿，东至函谷关，西至雍、陈仓。优旃曰：「善。多纵禽兽于其中，寇从东方来，令麋鹿触之足矣。」",
 act1v:"秦始皇曾商议要扩大皇家苑囿，东到函谷关，西到雍县、陈仓。优旃说：「好。多放些禽兽在里面，敌寇从东方来，让麋鹿用角去顶他们就够了。」",
 act2:"始皇闻之，知其为讽，遂辍止其议。",
 act2v:"秦始皇听了，知道这是借玩笑在劝谏，就停止了扩建苑囿的计划。",
 note:"「令麋鹿触之足矣。」—— 优旃只用了两句话。有时候，最短的谏言最锋利。",
 hint:"思辨：优旃、优孟、晏子，三个「顺着说」的劝谏，你最喜欢哪个？为什么比「讲道理」有效？",
 tags:["智慧","应变"]},

{id:"zhuhai", dept:"胆智部", level:"🌿 进阶", title:"朱亥椎杀晋鄙",

const STAGE_SIZE = 8;
/* 多设备合并：每则记录取 finishedAt 较新者；阅读计划取并集并按 SPIRAL 螺旋序排列；阶段总结按日期+内容去重 */
function mergeState(a, b){
  const out = { plan: [], records: {}, summaries: [] };
  const ra = (a && a.records) || {}, rb = (b && b.records) || {};
  Object.keys(ra).concat(Object.keys(rb)).forEach(id=>{
    const x = ra[id], y = rb[id];
    if(x && y) out.records[id] = (y.finishedAt||0) > (x.finishedAt||0) ? y : x;
    else out.records[id] = x || y;
  });
  const inPlan = new Set([...((a && a.plan) || []), ...((b && b.plan) || [])]);
  const order = new Map(SPIRAL.map((id,i)=>[id,i]));
  out.plan = [...inPlan]
    .filter(id=>!out.records[id])
    .sort((x,y)=>{ const ox = order.has(x)?order.get(x):1e6, oy = order.has(y)?order.get(y):1e6; return ox-oy; });
  const seen = new Set();
  [...((a && a.summaries) || []), ...((b && b.summaries) || [])]
    .sort((x,y)=>(x.date||0)-(y.date||0))
    .forEach(s=>{ const k = (s.date||0) + "|" + (s.q1||""); if(!seen.has(k)){ seen.add(k); out.summaries.push(s); } });
  return out;
}

/* 篇目扩充迁移：把新增篇目按螺旋顺序并入旧计划 */
(function(){
  let changed = false;
  SPIRAL.forEach(id=>{ if(!state.plan.includes(id) && !state.records[id]){ state.plan.push(id); changed = true; } });
  if(changed) save();
})();
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); scheduleCloudPush(); }
function byId(id){ return STORIES.find(s=>s.id===id); }
function status(id){ if(state.records[id]) return "done"; return state.plan.includes(id) ? "todo" : "pool"; }
function doneCount(){ return Object.keys(state.records).length; }
function nextStory(){ return state.plan.map(byId).find(s=>s && !state.records[s.id]) || null; }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none",2200); }
function fmtDate(ts){ const d=new Date(ts); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>"); }
